<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>התחברות | MyOS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='6 -9 88 103'%3E%3Crect x='6' y='-9' width='88' height='103' fill='%230E1A33'/%3E%3Cpath d='M38 6 L20 6 L6 20 L6 80 L20 94 L80 94 L94 80 L94 20 L80 6 L62 6 L62 24 L76 38 L76 62 L62 76 L38 76 L24 62 L24 38 L38 24 Z' fill='%23eff3fa'/%3E%3Cpath d='M46 -9 L54 -9 L58 -5 L58 30 L50 38 L42 30 L42 -5 Z' fill='%232ff0e6'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100svh;display:flex;flex-direction:column;
    background:#0E1A33;color:#cfd8ea;
    font-family:'Heebo',system-ui,'Segoe UI',Arial,sans-serif;line-height:1.7;
  }
  .wrap{flex:1;display:grid;place-items:center;padding:1.25rem;width:100%;}
  .card{
    width:min(24rem,100%);background:#16264a;border:1px solid #26375c;border-radius:1.1rem;
    padding:2rem 1.75rem;
  }
  .logo{display:flex;align-items:baseline;gap:.055em;justify-content:center;direction:ltr;
    font-size:2.1rem;line-height:1.38;padding-bottom:.6rem}
  .logo b{background:linear-gradient(122deg,#0a5766 0%,#13a8bd 44%,#2ff0e6 80%,#8dfff4 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    font-weight:700}
  .logo svg{width:.72em;height:.826em;align-self:center;overflow:visible}
  h1{font-size:1.15rem;font-weight:600;color:#eef3fb;text-align:center;margin-bottom:1.25rem}
  label{display:block;font-size:.92rem;margin:0 0 .35rem;color:#e6ecf7;font-weight:500}
  input{
    width:100%;font:inherit;font-size:1rem;color:#12233f;background:#f5f8fc;
    border:1.5px solid #cdd8ec;border-radius:.6rem;padding:.72rem .9rem;margin-bottom:1rem;
  }
  input::placeholder{color:#8492ac}
  input:focus-visible{outline:none;border-color:#0a5766;background:#fff;box-shadow:0 0 0 3px rgba(47,240,230,.4)}
  button{
    width:100%;font:inherit;font-weight:600;font-size:1.02rem;cursor:pointer;
    background:#2ff0e6;color:#04121a;border:0;border-radius:.65rem;padding:.85rem;
  }
  button:disabled{opacity:.6;cursor:progress}
  .msg{margin-top:.9rem;font-size:.9rem;text-align:center;min-height:1.4em}
  .msg.err{color:#ffb3a4}
  .msg.ok{color:#8dfff4}
  .links{margin-top:1.1rem;text-align:center;font-size:.85rem;color:#b9c5dd}
  .links a{color:#8dfff4;cursor:pointer;text-decoration:underline;text-underline-offset:.22em}
  textarea{
    width:100%;font:inherit;font-size:1rem;color:#12233f;background:#f5f8fc;
    border:1.5px solid #cdd8ec;border-radius:.6rem;padding:.7rem .9rem;margin-bottom:1rem;
    resize:vertical;min-height:3.2rem;
  }
  textarea::placeholder{color:#8492ac}
  textarea:focus-visible{outline:none;border-color:#0a5766;background:#fff;box-shadow:0 0 0 3px rgba(47,240,230,.4)}
  .opt{font-weight:400;color:#9fb0cc;font-size:.82rem}
  .hp{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  /* פוטר כמו באתר */
  footer{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.45rem .85rem;
    padding:1.25rem;font-size:.8rem;color:#8ea3c7;border-top:1px solid #21324f;
  }
  footer a{color:#8ea3c7;text-decoration:underline;text-underline-offset:.2em}
  footer a:hover,footer a:focus-visible{color:#8dfff4}
  footer .sep{width:3px;height:3px;border-radius:50%;background:#3a4a66;display:block}
  footer .mono{font-variant-numeric:tabular-nums}
  .flogo{display:inline-flex;align-items:baseline;gap:.04em;direction:ltr;font-size:1.05rem;line-height:1}
  .flogo .my,.flogo .sc{
    background:linear-gradient(122deg,#0a5766 0%,#13a8bd 44%,#2ff0e6 80%,#8dfff4 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;
  }
  .flogo .o{display:block;width:.72em;height:.826em;align-self:center;flex:none}
  .flogo .o svg{width:100%;height:100%;display:block;overflow:visible}
  .flogo .ring{fill:#eff3fa} .flogo .stem{fill:#2ff0e6}
  .pw{position:relative;margin-bottom:1rem}
  .pw>input{margin-bottom:0;padding-left:3rem}
  .pw .eye{position:absolute;left:.5rem;top:0;bottom:0;margin:auto;height:1.7rem;display:flex;align-items:center;
    background:none;border:0;padding:0 .35rem;cursor:pointer;color:#5b6b86;font-size:.78rem;font-weight:600}
  .pw .eye:hover{color:#0a5766}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<main class="card">
  <div class="logo" aria-label="MyOS"><b>My</b><svg viewBox="6 -7 88 101" aria-hidden="true"><path fill="#eff3fa" d="M38 6 L20 6 L6 20 L6 80 L20 94 L80 94 L94 80 L94 20 L80 6 L62 6 L62 20 L80 34 L80 66 L62 80 L38 80 L20 66 L20 34 L38 20 Z"/><path fill="#2ff0e6" d="M47 -7 L53 -7 L57 -3 L57 31 L50 38 L43 31 L43 -3 Z"/></svg><b>S</b></div>

  <!-- ---------- התחברות ---------- -->
  <form id="loginForm">
    <h1 id="title">התחברות לחשבון MyOS</h1>
    <label for="email">דוא״ל</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">סיסמה</label>
    <div class="pw"><input id="password" type="password" autocomplete="current-password" required><button type="button" class="eye" id="pwEye">הצג</button></div>
    <button id="submit" type="submit">התחברות</button>
    <p class="msg" id="msg" role="status"></p>
    <p class="links">
      <a id="forgot">שכחתי סיסמה</a> ·
      עדיין אין חשבון? <a id="openRegister">הרשמה לניסיון</a>
    </p>
    <p class="links" style="margin-top:.45rem"><a id="openContact">או צרו קשר</a></p>
  </form>

  <!-- ---------- הרשמה לניסיון ---------- -->
  <form id="registerForm" class="hidden">
    <h1>הרשמה — ניסיון MyOS עסקאות</h1>
    <label for="rName">שם מלא</label>
    <input id="rName" type="text" autocomplete="name" required>
    <label for="rEmail">דוא״ל</label>
    <input id="rEmail" type="email" autocomplete="username" required>
    <label for="rPassword">סיסמה <span class="opt">(לפחות 8 תווים)</span></label>
    <div class="pw"><input id="rPassword" type="password" autocomplete="new-password" required minlength="8"><button type="button" class="eye" id="rEye">הצג</button></div>
    <button id="rSubmit" type="submit">הרשמה</button>
    <p class="msg" id="rStatus" role="status"></p>
    <p class="links"><a id="rBack">חזרה להתחברות</a></p>
  </form>

  <!-- ---------- יצירת קשר (במקום פתיחת תוכנת מייל) ---------- -->
  <form id="contactForm" class="hidden">
    <h1>נשמח ליצור קשר</h1>
    <label class="hp" for="cBot">אל תמלאו שדה זה</label>
    <input class="hp" type="checkbox" id="cBot" tabindex="-1" autocomplete="off">
    <label for="cName">שם מלא</label>
    <input id="cName" type="text" autocomplete="name" required>
    <label for="cPhone">טלפון</label>
    <input id="cPhone" type="tel" inputmode="tel" autocomplete="tel" required>
    <label for="cMsg">הודעה <span class="opt">(אופציונלי)</span></label>
    <textarea id="cMsg" rows="2" placeholder="נשמח לשמוע איך נוכל לעזור"></textarea>
    <button id="cSubmit" type="submit">שליחה</button>
    <p class="msg" id="cStatus" role="status"></p>
    <p class="links"><a id="cBack">חזרה להתחברות</a></p>
  </form>

  <!-- ---------- קביעת סיסמה חדשה (אחרי קישור איפוס) ---------- -->
  <form id="resetForm" class="hidden">
    <h1>קביעת סיסמה חדשה</h1>
    <label for="newPassword">סיסמה חדשה</label>
    <input id="newPassword" type="password" autocomplete="new-password" required minlength="8">
    <button id="resetSubmit" type="submit">שמירה</button>
    <p class="msg" id="resetMsg" role="status"></p>
  </form>
</main>
</div>

<footer>
  <span class="flogo" dir="ltr" role="img" aria-label="MyOS">
    <span class="my" aria-hidden="true">My</span>
    <span class="o" aria-hidden="true"><svg viewBox="6 -7 88 101" focusable="false"><path class="ring" d="M38 6 L20 6 L6 20 L6 80 L20 94 L80 94 L94 80 L94 20 L80 6 L62 6 L62 20 L80 34 L80 66 L62 80 L38 80 L20 66 L20 34 L38 20 Z"/><path class="stem" d="M47 -7 L53 -7 L57 -3 L57 31 L50 38 L43 31 L43 -3 Z"/></svg></span>
    <span class="sc" aria-hidden="true">S</span>
  </span>
  <span class="sep" aria-hidden="true"></span>
  <a href="tel:+97235333630" class="mono" dir="ltr">03-5333630</a>
  <span class="sep" aria-hidden="true"></span>
  <a href="mailto:team@myos.co.il">team@myos.co.il</a>
  <span class="sep" aria-hidden="true"></span>
  <a href="https://myos.co.il/#accessibility">הצהרת נגישות</a>
  <span class="sep" aria-hidden="true"></span>
  <span dir="ltr">© 2026 MyOS</span>
</footer>

<script src="js/supabase.umd.js"></script>
<script>
/* ============================================================
   מלאו אחרי הקמת הפרויקט (Supabase → Settings → API):
   ============================================================ */
var SUPABASE_URL = 'https://oxofnuciofugcjlcwtqp.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94b2ZudWNpb2Z1Z2NqbGN3dHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1ODE4OTUsImV4cCI6MjEwMzE1Nzg5NX0.E255x5r5mfpiGUvM4O7n64SFJ_tynx96Tg6HK7EaQxA';

(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    $('msg').className = 'msg err';
    $('msg').textContent = 'הדף עוד לא הוגדר (חסרים פרטי שרת)';
    $('submit').disabled = true;
    return;
  }
  var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* התוסף פותח את הדף עם ‎#ext=<redirect>‎ — לשם מחזירים את הטוקנים */
  function extRedirect() {
    var m = location.hash.match(/ext=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function say(id, text, tone) {
    $(id).className = 'msg ' + (tone || '');
    $(id).textContent = text;
  }

  /* ---------- קישור איפוס סיסמה מחזיר לכאן עם type=recovery ---------- */
  if (/type=recovery/.test(location.hash)) {
    $('loginForm').classList.add('hidden');
    $('resetForm').classList.remove('hidden');
  }

  $('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('resetSubmit').disabled = true;
    var r = await client.auth.updateUser({ password: $('newPassword').value });
    $('resetSubmit').disabled = false;
    if (r.error) { say('resetMsg', 'לא הצלחנו לעדכן: ' + r.error.message, 'err'); return; }
    say('resetMsg', 'הסיסמה עודכנה. אפשר לחזור לתוסף ולהתחבר.', 'ok');
    setTimeout(function () { location.hash = ''; location.reload(); }, 1800);
  });

  /* ---------- יצירת קשר: מעבר בין הטפסים ---------- */
  var W3F_KEY = 'cf8458e1-fbd7-4677-8032-8ec685184dc6';
  $('openContact').addEventListener('click', function () {
    $('loginForm').classList.add('hidden');
    $('contactForm').classList.remove('hidden');
    $('cName').focus();
  });
  $('cBack').addEventListener('click', function () {
    $('contactForm').classList.add('hidden');
    $('loginForm').classList.remove('hidden');
  });

  $('contactForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    if ($('cBot').checked) return;                 /* מלכודת בוטים */
    var name = $('cName').value.trim(), phone = $('cPhone').value.trim();
    if (!name || !phone) { say('cStatus', 'נא למלא שם וטלפון', 'err'); return; }
    $('cSubmit').disabled = true;
    say('cStatus', 'שולח…');
    try {
      var fd = new FormData();
      fd.append('access_key', W3F_KEY);
      fd.append('subject', 'פנייה חדשה — התחברות MyOS עסקאות');
      fd.append('from_name', 'myos.co.il/login');
      fd.append('שם מלא', name);
      fd.append('טלפון', phone);
      fd.append('הודעה', $('cMsg').value.trim());
      var res = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: fd });
      var j = await res.json();
      if (j && j.success) {
        say('cStatus', 'תודה! נחזור אליכם בהקדם ✓', 'ok');
        $('contactForm').reset();
      } else {
        say('cStatus', 'השליחה נכשלה — נסו שוב או טלפנו 03-5333630', 'err');
      }
    } catch (err) {
      say('cStatus', 'שגיאת רשת — נסו שוב או טלפנו 03-5333630', 'err');
    }
    $('cSubmit').disabled = false;
  });

  /* ---------- שכחתי סיסמה ---------- */
  $('forgot').addEventListener('click', async function () {
    var email = $('email').value.trim();
    if (!email) { say('msg', 'מלאו דוא״ל ולחצו שוב על "שכחתי סיסמה"', 'err'); return; }
    var r = await client.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname
    });
    say('msg', r.error ? 'שגיאה: ' + r.error.message : 'נשלח קישור איפוס למייל', r.error ? 'err' : 'ok');
  });

  /* ---------- הצג/הסתר סיסמה ---------- */
  function attachEye(inputId, btnId) {
    var inp = $(inputId), btn = $(btnId);
    if (!inp || !btn) return;
    btn.addEventListener('click', function () {
      var toText = inp.type === 'password';
      inp.type = toText ? 'text' : 'password';
      btn.textContent = toText ? 'הסתר' : 'הצג';
    });
  }
  attachEye('password', 'pwEye');
  attachEye('rPassword', 'rEye');

  /* ---------- הרשמה לניסיון ---------- */
  $('openRegister').addEventListener('click', function () {
    $('loginForm').classList.add('hidden');
    $('registerForm').classList.remove('hidden');
    $('rName').focus();
  });
  $('rBack').addEventListener('click', function () {
    $('registerForm').classList.add('hidden');
    $('loginForm').classList.remove('hidden');
  });
  $('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var name = $('rName').value.trim(), email = $('rEmail').value.trim(), pw = $('rPassword').value;
    if (!name || !email || pw.length < 8) { say('rStatus', 'מלאו שם, דוא״ל וסיסמה בת 8 תווים לפחות', 'err'); return; }
    $('rSubmit').disabled = true; say('rStatus', 'נרשם…');
    var r = await client.auth.signUp({ email: email, password: pw, options: { data: { full_name: name } } });
    if (r.error) { $('rSubmit').disabled = false; say('rStatus', 'ההרשמה נכשלה: ' + r.error.message, 'err'); return; }
    /* התרעה אלינו על נרשם חדש (Web3Forms) */
    try {
      var fd = new FormData();
      fd.append('access_key', W3F_KEY);
      fd.append('subject', 'הרשמה חדשה לניסיון — MyOS עסקאות');
      fd.append('from_name', 'myos.co.il/login');
      fd.append('שם', name);
      fd.append('דוא״ל', email);
      fd.append('הודעה', 'משתמש חדש נרשם וממתין לאישור ניסיון 7 ימים.');
      await fetch('https://api.web3forms.com/submit', { method: 'POST', body: fd });
    } catch (err) { /* לא חוסם את ההרשמה אם ההתרעה נכשלה */ }
    $('rSubmit').disabled = false;
    say('rStatus', 'נרשמת בהצלחה! החשבון ממתין לאישור ניסיון — נאשר אותו בהקדם ונעדכן אותך.', 'ok');
    $('registerForm').reset();
  });

  /* ---------- התחברות ---------- */
  $('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('submit').disabled = true;
    say('msg', 'מתחבר…');
    var r = await client.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });
    $('submit').disabled = false;
    if (r.error) {
      say('msg', 'ההתחברות נכשלה — בדקו דוא״ל וסיסמה', 'err');
      return;
    }
    var s = r.data.session;
    var back = extRedirect();
    if (back) {
      /* חזרה לתוסף עם הטוקנים ב-fragment (לא נשלח לשום שרת) */
      location.replace(back + '#access_token=' + encodeURIComponent(s.access_token) +
                       '&refresh_token=' + encodeURIComponent(s.refresh_token) +
                       '&expires_in=' + encodeURIComponent(s.expires_in));
    } else {
      say('msg', 'מחוברים ✓ אפשר לחזור לתוסף', 'ok');
    }
  });
})();
</script>
</body>
</html>
