<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול ניסיונות | MyOS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='6 -9 88 103'%3E%3Crect x='6' y='-9' width='88' height='103' fill='%230E1A33'/%3E%3Cpath d='M38 6 L20 6 L6 20 L6 80 L20 94 L80 94 L94 80 L94 20 L80 6 L62 6 L62 24 L76 38 L76 62 L62 76 L38 76 L24 62 L24 38 L38 24 Z' fill='%23eff3fa'/%3E%3Cpath d='M46 -9 L54 -9 L58 -5 L58 30 L50 38 L42 30 L42 -5 Z' fill='%232ff0e6'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0}
  :root{--navy:#0E1A33;--navy2:#0b1428;--card:#16264a;--line:#26375c;--text:#cfd8ea;--dim:#9aa8c4;--heading:#eef3fb;--accent:#2ff0e6;--accent2:#8dfff4;--wait:#ffcf6b;--done:#66e6a8}
  body{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,#12233f,var(--navy) 55%,var(--navy2));color:var(--text);font-family:'Heebo',system-ui,'Segoe UI',Arial,sans-serif;line-height:1.6}
  .top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1.2rem;border-bottom:1px solid var(--line)}
  .logo{display:inline-flex;align-items:center;gap:.45em;direction:rtl;font-size:1.35rem}
  .logo .mark{display:inline-flex;align-items:baseline;gap:.04em;direction:ltr}
  .logo .my,.logo .sc{background:linear-gradient(122deg,#13a8bd,#2ff0e6 60%,#8dfff4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
  .logo .o{display:block;width:.72em;height:.826em;align-self:center;flex:none}
  .logo .o svg{width:100%;height:100%;display:block;overflow:visible}
  .logo .ring{fill:#eff3fa}.logo .stem{fill:#2ff0e6}
  .logo .pt{font-size:.62em;color:#dbe4f5;font-weight:600}
  .top .right{display:flex;align-items:center;gap:.7rem;font-size:.85rem;color:var(--dim)}
  .top .right button{color:var(--dim);background:none;border:1px solid var(--line);border-radius:.5rem;padding:.35rem .75rem;cursor:pointer;font:inherit;font-size:.82rem}
  .top .right button:hover{border-color:var(--accent);color:var(--accent)}
  .wrap{width:min(125rem,100%);margin:0 auto;padding:1.6rem 1.2rem 4rem;flex:1}
  h1{color:var(--heading);font-size:1.4rem;margin-bottom:1.2rem}
  h2{color:var(--heading);font-size:1.05rem;margin:1.6rem 0 .7rem}
  /* login card */
  .card{width:min(23rem,100%);margin:3rem auto;background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1.8rem 1.6rem}
  .card h1{text-align:center;font-size:1.15rem}
  label{display:block;font-size:.9rem;color:#e6ecf7;margin:.2rem 0 .35rem}
  input{width:100%;font:inherit;font-size:1rem;color:#12233f;background:#f5f8fc;border:1.5px solid #cdd8ec;border-radius:.6rem;padding:.7rem .9rem;margin-bottom:1rem}
  input:focus-visible{outline:none;border-color:#0a5766;background:#fff;box-shadow:0 0 0 3px rgba(47,240,230,.35)}
  .btn{width:100%;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;background:var(--accent);color:#04121a;border:0;border-radius:.65rem;padding:.8rem}
  .btn:hover{background:var(--accent2)}
  .btn:disabled{opacity:.6;cursor:progress}
  .msg{margin-top:.8rem;font-size:.9rem;text-align:center;min-height:1.3em}
  .msg.err{color:#ffb3a4}.msg.ok{color:#8dfff4}
  /* rows */
  .list{display:flex;flex-direction:column;gap:.6rem}
  .row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;background:var(--card);border:1px solid var(--line);border-radius:.75rem;padding:.75rem .95rem}
  .row .info{min-width:0}
  .row .em{color:var(--heading);font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta{color:var(--dim);font-size:.8rem;margin-top:.1rem}
  .grant{background:var(--accent);color:#04121a;border:0;border-radius:.55rem;padding:.5rem .9rem;cursor:pointer;font:inherit;font-weight:600;font-size:.85rem;flex:none}
  .grant:hover{background:var(--accent2)}
  .grant.ext{background:none;border:1px solid var(--line);color:var(--dim)}
  .grant.ext:hover{border-color:var(--accent);color:var(--accent)}
  .pill{font-size:.74rem;padding:.2rem .6rem;border-radius:999px;border:1px solid;white-space:nowrap;flex:none}
  .pill.active{color:var(--done);border-color:rgba(102,230,168,.4);background:rgba(102,230,168,.08)}
  .empty{color:var(--dim);font-size:.9rem;padding:.6rem 0}
  /* device management */
  .ucard{background:var(--card);border:1px solid var(--line);border-radius:.75rem;padding:.75rem .95rem;display:flex;flex-direction:column;gap:.6rem}
  .ucard .head{display:flex;align-items:center;justify-content:space-between;gap:.8rem}
  .devbox{border-top:1px dashed var(--line);padding-top:.55rem}
  .devsum{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
  .devsum .cnt{color:var(--dim);font-size:.85rem}
  .devsum .cnt b{color:var(--heading)}
  .devsum .cnt.full b{color:var(--wait)}
  .miniadd{background:none;border:1px solid var(--line);color:var(--dim);border-radius:.5rem;padding:.35rem .7rem;cursor:pointer;font:inherit;font-size:.8rem;flex:none}
  .miniadd:hover{border-color:var(--accent);color:var(--accent)}
  .devlist{display:flex;flex-direction:column;gap:.4rem;margin-top:.5rem}
  .devline{display:flex;align-items:center;justify-content:space-between;gap:.6rem;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:.5rem;padding:.4rem .6rem}
  .devline .dinfo{min-width:0}
  .devline .dname{color:var(--heading);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .devline .did{color:var(--dim);font-size:.72rem;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
  .devline .dmeta{color:var(--dim);font-size:.72rem}
  .relbtn{background:none;border:1px solid rgba(255,179,164,.35);color:#ffb3a4;border-radius:.45rem;padding:.32rem .65rem;cursor:pointer;font:inherit;font-size:.78rem;flex:none}
  .relbtn:hover{background:rgba(255,179,164,.1)}
  .devnone{color:var(--dim);font-size:.8rem;padding:.2rem 0}
  .acts{display:flex;align-items:center;gap:.45rem;flex:none;flex-wrap:wrap;justify-content:flex-end}
  .warnbtn{background:none;border:1px solid rgba(255,207,107,.4);color:var(--gold,#ffcf6b);border-radius:.55rem;padding:.5rem .8rem;cursor:pointer;font:inherit;font-weight:600;font-size:.82rem}
  .warnbtn:hover{background:rgba(255,207,107,.1)}
  .delbtn{background:none;border:1px solid rgba(255,120,100,.4);color:#ff8f7d;border-radius:.55rem;padding:.5rem .8rem;cursor:pointer;font:inherit;font-weight:600;font-size:.82rem}
  .delbtn:hover{background:rgba(255,120,100,.1)}
  .delbtn.armed,.warnbtn.armed{color:#fff}
  .delbtn.armed{background:#c0392b;border-color:#c0392b}
  .warnbtn.armed{background:#b8860b;border-color:#b8860b}
  .pill.susp{color:var(--gold,#ffcf6b);border-color:rgba(255,207,107,.4);background:rgba(255,207,107,.08)}
  .pw{position:relative;margin-bottom:1rem}
  .pw>input{margin-bottom:0;padding-left:2.9rem}
  .pw .eye{position:absolute;left:.4rem;top:0;bottom:0;margin:auto;width:2.1rem;height:2rem;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer;color:#5b6b86}
  .pw .eye:hover{color:#0a5766}.pw .eye svg{width:1.3rem;height:1.3rem;display:block}
  .or{display:flex;align-items:center;gap:.6rem;color:#7d8ca8;font-size:.82rem;margin:.55rem 0 .9rem}
  .or::before,.or::after{content:"";flex:1;height:1px;background:#2a3a58}
  .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:.6rem;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;background:#fff;color:#1f2430;border:0;border-radius:.65rem;padding:.72rem}
  .gbtn:hover{background:#eef1f6}.gbtn svg{width:1.1rem;height:1.1rem;flex:none}
  .csvbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:.55rem;padding:.5rem .9rem;cursor:pointer;font:inherit;font-size:.85rem}
  .csvbtn:hover{border-color:var(--accent);color:var(--accent)}
  /* פקדי טווח: ימים / תאריך סיום / ללא הגבלה */
  .row,.ucard .head{flex-wrap:wrap}
  .row .info,.ucard .info{flex:1 1 15rem}
  .rangebar{flex-basis:100%;display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:.55rem}
  .rangebar .hint{color:var(--dim);font-size:.78rem}
  .range{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
  .range input{width:auto;margin:0;padding:.38rem .5rem;font-size:.85rem;border-radius:.5rem;background:#f5f8fc;color:#12233f;border:1.5px solid #cdd8ec}
  .range input[type=number]{width:4.2rem;text-align:center}
  .range input[type=date]{width:9.2rem;direction:ltr}
  .range .lbl{color:var(--dim);font-size:.78rem}
  .range .sep{color:var(--line);font-size:.8rem}
  .unlim{background:none;border:1px solid rgba(102,230,168,.4);color:var(--done);border-radius:.55rem;padding:.5rem .8rem;cursor:pointer;font:inherit;font-weight:600;font-size:.82rem}
  .unlim:hover{background:rgba(102,230,168,.1)}
  .unlim.armed{background:#1f8f5f;border-color:#1f8f5f;color:#fff}
  .pill.life{color:var(--accent);border-color:rgba(47,240,230,.4);background:rgba(47,240,230,.08)}
  .row .em,.ucard .em{white-space:normal;word-break:break-all}
  .nm{color:var(--heading);font-weight:700;font-size:1rem}
  .nm+.em{font-weight:400;color:var(--text);font-size:.88rem}

  /* ---------- טבלת מנויים (רחבה, גלילה אופקית) ---------- */
  .toolbar{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin:.2rem 0 .8rem}
  .toolbar input{width:min(22rem,100%);margin:0;padding:.55rem .8rem;font-size:.95rem}
  .toolbar .cnt{color:var(--dim);font-size:.85rem}
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:.75rem;background:var(--card)}
  table.ut{border-collapse:separate;border-spacing:0;width:100%;min-width:1480px;font-size:.86rem}
  table.ut.pend{min-width:1180px}
  table.ut th,table.ut td{padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:top;text-align:right}
  table.ut th{position:sticky;top:0;background:#1b2d55;color:var(--heading);font-weight:700;font-size:.8rem;white-space:nowrap;z-index:1;cursor:pointer;user-select:none}
  table.ut th.ns{cursor:default}
  table.ut th .arr{color:var(--accent);font-size:.7rem;margin-inline-start:.25rem}
  table.ut tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
  table.ut tbody tr:hover td{background:rgba(47,240,230,.06)}
  table.ut tr:last-child td{border-bottom:0}
  table.ut td.nmcell{min-width:9rem;max-width:14rem}
  table.ut td .nm{font-size:.92rem;margin:0}
  table.ut td .em{font-size:.82rem;color:var(--text);direction:ltr;text-align:right;word-break:break-all}
  table.ut td.nw{white-space:nowrap}
  table.ut td .ls{color:var(--dim);font-size:.78rem}
  table.ut td.expiring{color:var(--wait);font-weight:700}
  table.ut td.expired{color:#ff8f7d;font-weight:700}
  table.ut .range{justify-content:flex-start;flex-wrap:nowrap}
  table.ut .range input{padding:.3rem .45rem;font-size:.82rem}
  table.ut .range input[type=number]{width:3.6rem}
  table.ut .range input[type=date]{width:8.6rem}
  table.ut .grant,table.ut .unlim,table.ut .warnbtn,table.ut .delbtn{padding:.34rem .6rem;font-size:.78rem}
  table.ut .devcell{min-width:17rem}
  table.ut .devsum{margin-bottom:.25rem}
  table.ut .devline{padding:.25rem .45rem;gap:.4rem}
  table.ut .devline .dname{font-size:.78rem}
  table.ut .devline .did{font-size:.66rem;max-width:11rem}
  table.ut .devline .dmeta{font-size:.68rem}
  table.ut .miniadd{padding:.25rem .55rem;font-size:.74rem}
  table.ut .acts{justify-content:flex-start;flex-wrap:nowrap}
  table.ut .noexp{color:#ffb3a4;font-size:.82rem}
  /* עמודת "שלב" — ציר ההתקדמות של הנרשם: נרשם ← אימת ← התקין ← ייצא */
  table.ut .stg{display:inline-block;font-size:.78rem;padding:.18rem .55rem;border-radius:999px;
                border:1px solid;white-space:nowrap;font-weight:600}
  table.ut .stg-1{color:#ffb3a4;border-color:rgba(255,179,164,.45);background:rgba(255,179,164,.09)}
  table.ut .stg-2{color:#ffcf6b;border-color:rgba(255,207,107,.45);background:rgba(255,207,107,.09)}
  table.ut .stg-3{color:var(--accent);border-color:rgba(47,240,230,.45);background:rgba(47,240,230,.09)}
  table.ut .stg-4{color:var(--done);border-color:rgba(102,230,168,.45);background:rgba(102,230,168,.09)}
  table.ut .stgsub{display:block;color:var(--dim);font-size:.75rem;margin-top:.22rem}
  .cnt .sdot{margin-inline-start:.5rem;white-space:nowrap}
  table.ut .idx{color:var(--dim);font-size:.74rem;width:2rem}
  table.ut .empty{padding:.8rem}
  .hidden{display:none}
  /* נגישות */
  .skip{position:absolute;top:0;inset-inline-start:1rem;z-index:200;transform:translateY(-150%);background:#2ff0e6;color:#0E1A33;padding:.75rem 1.25rem;border-radius:0 0 .6rem .6rem;font-weight:700;text-decoration:none;transition:transform .15s ease}
  .skip:focus{transform:translateY(0)}
  a:focus-visible,button:focus-visible,select:focus-visible{outline:none;box-shadow:0 0 0 3px #0E1A33,0 0 0 6px #2ff0e6;border-radius:.5rem}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

      <th data-k="last_sign_in_at">התחברות אחרונה</th><th data-k="stage">שלב</th><th class="ns">חידוש — נספר מסוף התוקף הנוכחי</th>
      <th data-k="devices">מחשבים</th><th class="ns">פעולות</th>

<script src="js/supabase.umd.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var SUPABASE_URL='https://oxofnuciofugcjlcwtqp.supabase.co';
  var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94b2ZudWNpb2Z1Z2NqbGN3dHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1ODE4OTUsImV4cCI6MjEwMzE1Nzg5NX0.E255x5r5mfpiGUvM4O7n64SFJ_tynx96Tg6HK7EaQxA';
  var client=supabase.createClient(SUPABASE_URL, ANON);
  var token=null, allUsers=[];

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtDate(s){ if(!s) return ''; try{ return new Date(s).toLocaleDateString('he-IL'); }catch(e){ return s; } }
  /* תאריך + שעה בשעון ישראל, למשל 5.9.2026 14:32 */
  function fmtDateTime(s){
    if(!s) return '';
    try{
      var d=new Date(s);
      return d.toLocaleDateString('he-IL',{timeZone:'Asia/Jerusalem'})+' '+
             d.toLocaleTimeString('he-IL',{timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit'});

  }
  /* שם מלא (אם יש) מעל המייל */
  function nameHtml(u){
    return (u.full_name ? '<div class="nm">'+esc(u.full_name)+'</div>' : '')+
           '<div class="em">'+esc(u.email||u.user_id)+'</div>';

  function lastSeenHtml(u){
    return u.last_sign_in_at
      ? ' · <span class="ls">התחברות אחרונה: '+esc(fmtDateTime(u.last_sign_in_at))+'</span>'
      : ' · <span class="ls">טרם התחבר</span>';

  /* בלוק פקדי הטווח (ימים / תאריך סיום) + כפתור פעולה + ללא הגבלה */
  function rangeHtml(actionLabel){
    return '<div class="range">'+
               '<input type="number" min="1" max="3650" value="7" data-days aria-label="מספר ימים"><span class="lbl">ימים</span>'+
               '<span class="sep">|</span>'+
               '<input type="date" data-until aria-label="תאריך סיום">'+
               '<button class="grant" data-grant="1">'+esc(actionLabel)+'</button>'+
               '<button class="unlim" data-unlim="1">ללא הגבלה</button>'+
           '</div>';
  }
  /* קריאת הבחירה מהפקדים: תאריך אם מולא, אחרת ימים */
  function readRange(el){
    var until=el.querySelector('[data-until]').value;
    var days=parseInt(el.querySelector('[data-days]').value,10);
    if(until) return {until:until};
    if(days>0) return {days:days};
    return null;
  }
  function wireRange(el, uid){
    el.querySelector('[data-grant]').addEventListener('click',function(){
      var opt=readRange(el);
      if(!opt){ $('boardMsg').className='msg err'; $('boardMsg').textContent='ציין מספר ימים או בחר תאריך סיום'; return; }
      grant(uid, this, opt);
    });
    confirmClick(el.querySelector('[data-unlim]'),'בטוח? ללא הגבלה',function(b){ grant(uid, b, {unlimited:true}); });
    /* בחירת תאריך מנקה את שדה הימים כדי שיהיה ברור מה נשלח */
    el.querySelector('[data-until]').addEventListener('change',function(){ if(this.value) el.querySelector('[data-days]').value=''; });
    el.querySelector('[data-days]').addEventListener('input',function(){ if(this.value) el.querySelector('[data-until]').value=''; });
  }

  async function fn(action, extra){
    var body=Object.assign({action:action}, extra||{});
    try{
      var res=await fetch(SUPABASE_URL+'/functions/v1/admin-trials',{
        method:'POST',
        headers:{ 'Authorization':'Bearer '+token, 'apikey':ANON, 'Content-Type':'application/json' },
        body:JSON.stringify(body)
      });
      var j=await res.json().catch(function(){return {ok:false,error:'תשובה לא תקינה מהשרת (status '+res.status+')'};});
      return { status:res.status, j:j };
    }catch(err){
      return { status:0, j:{ ok:false, error:'לא הצלחנו להגיע לפונקציה admin-trials — ודא שהיא פרוסה ושה-Verify JWT כבוי. ('+(err&&err.message||err)+')' } };
    }
  }

  function showBoard(email){
    $('loginCard').classList.add('hidden');
    $('board').classList.remove('hidden');
    $('who').classList.remove('hidden');
    $('whoEmail').textContent=email||'';
  }

  var sortKey={pending:'created_at',active:'valid_until'}, sortDir={pending:-1,active:1};
  function loadingRows(){
    $('pending').innerHTML='<tr><td colspan="8" class="empty">טוען…</td></tr>';
    $('active').innerHTML='<tr><td colspan="9" class="empty">טוען…</td></tr>';
  }
  async function load(){
    loadingRows();
    var r=await fn('list');
    if(r.status===403){ $('board').classList.add('hidden'); $('loginCard').classList.remove('hidden'); $('loginMsg').className='msg err'; $('loginMsg').textContent='החשבון הזה אינו מנהל.'; return; }
    if(!r.j.ok){
      $('pending').innerHTML='<tr><td colspan="8" class="empty">—</td></tr>';
      $('active').innerHTML='<tr><td colspan="9" class="empty">—</td></tr>';
      $('boardMsg').className='msg err'; $('boardMsg').textContent='שגיאה: '+(r.j.error||r.status);
      return;
    }
    $('boardMsg').textContent='';
    allUsers=r.j.users||[];
    render();
  }
  /* סינון לפי חיפוש + מיון + ציור שתי הטבלאות */
  function matches(u,q){
    if(!q) return true;
    return ((u.full_name||'')+' '+(u.email||'')).toLowerCase().indexOf(q)>=0;
  }
  function sortVal(u,k){
    if(k==='name') return ((u.full_name||'')+' '+(u.email||'')).toLowerCase();
    if(k==='status') return u.valid_until?1:0;            /* לצמיתות אחרון */
    if(k==='valid_until') return u.valid_until?new Date(u.valid_until).getTime():8.64e15;
    if(k==='devices') return (u.device_count||0);
    if(k==='stage') return stageNo(u)*1e13 + ((u.export_count||0)*1e6) + (u.device_count||0);
    return u[k]?new Date(u[k]).getTime():0;
  }
  function sorted(list,which){
    var k=sortKey[which], d=sortDir[which];
    return list.slice().sort(function(a,b){ var x=sortVal(a,k), y=sortVal(b,k); return x<y?-d:x>y?d:0; });
  }
  function render(){
    var q=($('q').value||'').trim().toLowerCase();
    var users=allUsers.filter(function(u){return matches(u,q);});
    var pending=users.filter(function(u){return !u.active;});
    var active=users.filter(function(u){return u.active;});
    renderPending(sorted(pending,'pending')); renderActive(sorted(active,'active'));
    /* משפך: כמה נתקעו בכל שלב. זו השורה שאומרת למי כדאי להרים טלפון. */
    var f=[0,0,0,0,0];
    allUsers.forEach(function(u){ f[stageNo(u)]++; });
    $('cnt').innerHTML=(q?'מוצגים '+users.length+' מתוך '+allUsers.length:allUsers.length+' נרשמים')+
      '<span class="sdot"><span class="stg stg-1">'+f[1]+' לא אימתו</span></span>'+
      '<span class="sdot"><span class="stg stg-2">'+f[2]+' לא התקינו</span></span>'+
      '<span class="sdot"><span class="stg stg-3">'+f[3]+' התקינו ולא ייצאו</span></span>'+
      '<span class="sdot"><span class="stg stg-4">'+f[4]+' עובדים</span></span>';
    document.querySelectorAll('table.ut th[data-k]').forEach(function(th){
      var which=th.closest('table').classList.contains('pend')?'pending':'active';
      var a=th.querySelector('.arr'); if(a) a.remove();
      if(th.getAttribute('data-k')===sortKey[which]){ var sp=document.createElement('span'); sp.className='arr'; sp.textContent=sortDir[which]>0?'▲':'▼'; th.appendChild(sp); }
    });
  }
  document.querySelectorAll('table.ut th[data-k]').forEach(function(th){
    th.addEventListener('click',function(){
      var which=th.closest('table').classList.contains('pend')?'pending':'active', k=th.getAttribute('data-k');
      if(sortKey[which]===k) sortDir[which]*=-1; else { sortKey[which]=k; sortDir[which]=1; }
      render();
    });
  });
  $('q').addEventListener('input', render);

  function validCell(u){
    if(!u.valid_until) return '<td class="nw"><b style="color:var(--accent)">ללא הגבלה</b></td>';
    var days=Math.ceil((new Date(u.valid_until).getTime()-Date.now())/864e5);
    var cls=days<0?' expired':days<=3?' expiring':'';
    return '<td class="nw'+cls+'">'+esc(fmtDate(u.valid_until))+(days<0?' (פג)':days<=7?' ('+days+' ימים)':'')+'</td>';
  }
  /* ---------- עמודת "שלב" ----------
   * ציר אחד במקום להצליב ארבע עמודות בעין. כל שלב נשען על עובדה בשרת:
   *   1 נרשם   — יש שורה, אבל email_confirmed_at ריק (לא לחץ על הקישור במייל)
   *   2 אימת   — המייל אומת (או נרשם דרך Google), אבל אין מחשב רשום = לא התקין
   *   3 התקין  — יש מחשב פעיל ב-devices (כלומר גם התחבר בתוסף), אבל 0 ייצואים
   *   4 ייצא   — יש רשומה ב-export_logs; זה המשתמש שבאמת עובד
   * מה שאי אפשר למדוד: הצמדת האייקון לסרגל — לכרום אין API לזה.
   * (שרתים ישנים שלא מחזירים email_confirmed_at: מתייחסים אליו כ"אומת"
   *  כדי לא לסמן את כולם באדום בטעות.) */
  var STAGES=[null,
    {t:'נרשם',  s:'לא אימת מייל'},
    {t:'אימת',  s:'לא התקין'},
    {t:'התקין', s:'לא ייצא'},
    {t:'ייצא',  s:''}];
  function stageNo(u){
    if((u.export_count||0)>0) return 4;
    if((u.device_count||0)>0) return 3;
    var known=('email_confirmed_at' in u);
    if(!known || u.email_confirmed_at) return 2;
    return 1;
  }
  function stageCell(u){
    var n=stageNo(u), st=STAGES[n];
    var sub=st.s;
    if(n===4){
      sub=(u.export_count||0)+' ייצואים · אחרון '+fmtDateTime(u.last_export_at);
    }else if(n===3 && u.device_count){
      sub='מחשב רשום · '+(u.last_sign_in_at?'נכנס '+fmtDateTime(u.last_sign_in_at):'');
    }
    return '<td class="nw"><span class="stg stg-'+n+'">'+n+'. '+esc(st.t)+'</span>'+
           (sub?'<span class="stgsub">'+esc(sub)+'</span>':'')+'</td>';
  }
  function lastCell(u){
    return '<td class="nw"><span class="ls">'+(u.last_sign_in_at?esc(fmtDateTime(u.last_sign_in_at)):'טרם התחבר')+'</span></td>';
  }

  function renderPending(list){
    var box=$('pending');
    if(!list.length){ box.innerHTML='<tr><td colspan="8" class="empty">אין נרשמים ממתינים.</td></tr>'; return; }
    box.innerHTML='';
    list.forEach(function(u,i){
      var blocked = u.license_status==='blocked';
      var tr=document.createElement('tr');
      tr.innerHTML='<td class="idx">'+(i+1)+'</td>'+
                   '<td class="nmcell">'+nameHtml(u)+'</td>'+
                   '<td class="nw">'+esc(fmtDate(u.created_at))+'</td>'+
                   lastCell(u)+
                   stageCell(u)+
                   '<td class="nw">'+(blocked?'<span class="pill susp">מושהה</span>':esc(u.license_status||'—'))+'</td>'+
                   '<td>'+(blocked ? '—' : rangeHtml('אשר'))+'</td>'+
                   '<td><div class="acts">'+
                     (blocked ? '<button class="grant" data-react="1">הפעל מחדש</button>' : '')+
                     '<button class="delbtn" data-del="1">מחק</button>'+
                   '</div></td>';
      if(!blocked) wireRange(tr, u.user_id);
      var rc=tr.querySelector('[data-react]'); if(rc) rc.addEventListener('click',function(){ reactivateUser(u.user_id, this); });
      confirmClick(tr.querySelector('[data-del]'),'בטוח? מחק',function(b){ deleteUser(u.user_id, b); });
      box.appendChild(tr);
    });
  }
  function renderActive(list){
    var box=$('active');
    if(!list.length){ box.innerHTML='<tr><td colspan="9" class="empty">אין מנויים פעילים.</td></tr>'; return; }
    box.innerHTML='';
    list.forEach(function(u,i){
      var max=u.max_devices==null?1:u.max_devices, cnt=u.device_count||0, full=cnt>=max;
      var devs=u.devices||[];
      var devRows = devs.length
        ? '<div class="devlist">'+devs.map(function(d){
            return '<div class="devline"><div class="dinfo"><div class="dname">'+esc(d.device_name||'מחשב')+'</div>'+
                   '<div class="did" title="'+esc(d.device_id||'')+'">'+esc(d.device_id||'')+'</div>'+
                   (d.last_seen?'<div class="dmeta">נראה לאחרונה: '+esc(fmtDateTime(d.last_seen))+'</div>':'')+'</div>'+
                   '<button class="relbtn" data-rel="'+esc(d.id)+'">שחרר</button></div>';
          }).join('')+'</div>'
        : '<div class="devnone">אין מחשבים מחוברים עדיין.</div>';
      var unlimited=!u.valid_until;
      var tr=document.createElement('tr');
      tr.innerHTML=
        '<td class="idx">'+(i+1)+'</td>'+
        '<td class="nmcell">'+nameHtml(u)+'</td>'+
        '<td class="nw">'+(unlimited?'<span class="pill life">לצמיתות</span>':'<span class="pill active">פעיל</span>')+'</td>'+
        validCell(u)+
        lastCell(u)+
        stageCell(u)+
        '<td>'+rangeHtml('חדש')+'</td>'+
        '<td class="devcell">'+
          '<div class="devsum"><span class="cnt'+(full?' full':'')+'">מחשבים: <b>'+cnt+' / '+max+'</b></span>'+
          '<button class="miniadd" data-add="1">+ הוסף מחשב</button></div>'+
          devRows+
        '</td>'+
        '<td><div class="acts">'+
          '<button class="warnbtn" data-suspend="1">השהה</button>'+
          '<button class="delbtn" data-del="1">מחק</button>'+
        '</div></td>';
      wireRange(tr, u.user_id);
      tr.querySelector('[data-suspend]').addEventListener('click',function(){ suspendUser(u.user_id, this); });
      confirmClick(tr.querySelector('[data-del]'),'בטוח? מחק',function(b){ deleteUser(u.user_id, b); });
      tr.querySelector('[data-add]').addEventListener('click',function(){ addDevice(u.user_id, this); });
      tr.querySelectorAll('[data-rel]').forEach(function(b){
        b.addEventListener('click',function(){ releaseDevice(b.getAttribute('data-rel'), b, u.email); });
      });
      box.appendChild(tr);
    });
  }

  /* לחיצה כפולה לאישור פעולה מסוכנת (מחיקה) */
  function confirmClick(btn, armedLabel, run){
    if(!btn) return;
    var armed=false, timer=null, orig=btn.textContent;
    btn.addEventListener('click', function(){
      if(armed){ clearTimeout(timer); armed=false; btn.classList.remove('armed'); run(btn); return; }
      armed=true; btn.textContent=armedLabel; btn.classList.add('armed');
      timer=setTimeout(function(){ armed=false; btn.textContent=orig; btn.classList.remove('armed'); }, 4000);
    });
  }

  async function suspendUser(uid, btn){
    btn.disabled=true; var o=btn.textContent; btn.textContent='משהה…';
    var r=await fn('suspend',{user_id:uid});
    if(!r.j.ok){ btn.disabled=false; btn.textContent=o; $('boardMsg').className='msg err'; $('boardMsg').textContent='שגיאה: '+(r.j.error||r.status); return; }
    await load();
    $('boardMsg').className='msg ok'; $('boardMsg').textContent='המנוי הושהה (עבר ל״ממתינים לאישור״) ✓';
  }

  async function reactivateUser(uid, btn){
    btn.disabled=true; var o=btn.textContent; btn.textContent='מפעיל…';
    var r=await fn('reactivate',{user_id:uid});
    if(!r.j.ok){ btn.disabled=false; btn.textContent=o; $('boardMsg').className='msg err'; $('boardMsg').textContent='שגיאה: '+(r.j.error||r.status); return; }
    await load();
    $('boardMsg').className='msg ok'; $('boardMsg').textContent='המנוי הופעל מחדש ✓';
  }

  async function deleteUser(uid, btn){
    btn.disabled=true; btn.textContent='מוחק…';
    var r=await fn('delete_user',{user_id:uid});
    if(!r.j.ok){ btn.disabled=false; btn.textContent='מחק'; btn.classList.remove('armed'); $('boardMsg').className='msg err'; $('boardMsg').textContent='שגיאה: '+(r.j.error||r.status); return; }
    await load();
    $('boardMsg').className='msg ok'; $('boardMsg').textContent='המשתמש נמחק'+(r.j.deleted?(' ('+r.j.deleted+')'):'')+' — האימייל פנוי להרשמה חדשה ✓';
  }

  async function addDevice(uid, btn){
    btn.disabled=true; var o=btn.textContent; btn.textContent='מוסיף…';
    var r=await fn('add_device',{user_id:uid});
    if(!r.j.ok){ btn.disabled=false; btn.textContent=o; $('boardMsg').className='msg err'; $('boardMsg').textContent='שגיאה: '+(r.j.error||r.status); return; }
    var nm=r.j.max_devices;
    await load();
    $('boardMsg').className='msg ok'; $('boardMsg').textContent='מכסת המחשבים עודכנה ל-'+nm+' ✓';
  }

  async function releaseDevice(rowId, btn, email){
    btn.disabled=true; var o=btn.textContent; btn.textContent='משחרר…';
    var r=await fn('release_device',{device_row_id:rowId});
    if(!r.j.ok){ btn.disabled=false; btn.textContent=o; $('boardMsg').className='msg err'; $('boardMsg').textContent='שגיאה: '+(r.j.error||r.status); return; }
    await load();
    $('boardMsg').className='msg ok'; $('boardMsg').textContent='המחשב שוחרר — המקום התפנה ✓';
  }

  /* opt: {days:N} | {until:'YYYY-MM-DD'} | {unlimited:true} */
  async function grant(uid, btn, opt){
    btn.disabled=true; var o=btn.textContent; btn.textContent='מאשר…';
    var r=await fn('grant',Object.assign({user_id:uid}, opt||{days:7}));
    if(!r.j.ok){ btn.disabled=false; btn.textContent=o; btn.classList.remove('armed'); $('boardMsg').className='msg err'; $('boardMsg').textContent='שגיאה: '+(r.j.error||r.status); return; }
    var mailed=r.j.emailed;
    await load();
    var what = r.j.unlimited ? 'המנוי הופעל ללא הגבלת זמן' : 'המנוי בתוקף עד '+fmtDate(r.j.valid_until);
    $('boardMsg').className='msg ok'; $('boardMsg').textContent=what+' ✓'+(mailed?' · מייל אישור נשלח למשתמש':'');
  }

  /* ---------- הצג/הסתר סיסמה (אייקון עין) ---------- */
  var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 12S5.4 5.5 12 5.5 22.2 12 22.2 12 18.6 18.5 12 18.5 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>';
  var EYEOFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 6c6.6 0 10.2 6 10.2 6a16 16 0 0 1-3.2 3.8M6.2 7.5A16 16 0 0 0 1.8 12S5.4 18 12 18a10 10 0 0 0 3.3-.6"/><path d="M9.9 9.9a3.2 3.2 0 0 0 4.3 4.3"/></svg>';
  (function(){ var inp=$('password'), btn=$('pwEye'); if(inp&&btn){ btn.innerHTML=EYE; btn.addEventListener('click',function(){ var t=inp.type==='password'; inp.type=t?'text':'password'; btn.innerHTML=t?EYEOFF:EYE; }); } })();

  /* ---------- התחברות עם Google ---------- */
  $('googleLogin').addEventListener('click', function(){
    client.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname } });
  });

  /* ---------- ייצוא מאגר נרשמים ל-CSV ---------- */
  function csvCell(v){ v=String(v==null?'':v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
  $('csvBtn').addEventListener('click', function(){
    if(!allUsers.length){ $('boardMsg').className='msg'; $('boardMsg').textContent='אין נתונים לייצוא'; return; }
    var head=['שם','אימייל','שלב','שלב #','תאריך הרשמה','אימות מייל','התחברות אחרונה','מחשבים','ייצואים','ייצוא אחרון','סטטוס רישיון','בתוקף עד','פעיל'];
    var lines=[head.map(csvCell).join(',')];
    allUsers.forEach(function(u){
      var sn=stageNo(u);
      lines.push([u.full_name||'', u.email||'', STAGES[sn].t+(STAGES[sn].s?' — '+STAGES[sn].s:''), sn, fmtDateTime(u.created_at), u.email_confirmed_at?fmtDateTime(u.email_confirmed_at):'', fmtDateTime(u.last_sign_in_at), u.device_count||0, u.export_count||0, u.last_export_at?fmtDateTime(u.last_export_at):'', u.license_status||'', u.valid_until?fmtDate(u.valid_until):(u.active?'ללא הגבלה':''), u.active?'כן':'לא'].map(csvCell).join(','));
    });
    var csv='\uFEFF'+lines.join('\r\n');
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='myos-registrants.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });

  $('loginBtn').addEventListener('click', async function(){
    var email=$('email').value.trim(), pw=$('password').value;
    if(!email||!pw){ $('loginMsg').className='msg err'; $('loginMsg').textContent='מלאו דוא״ל וסיסמה'; return; }
    $('loginBtn').disabled=true; $('loginMsg').className='msg'; $('loginMsg').textContent='מתחבר…';
    var r=await client.auth.signInWithPassword({email:email,password:pw});
    $('loginBtn').disabled=false;
    if(r.error){ $('loginMsg').className='msg err'; $('loginMsg').textContent='ההתחברות נכשלה — בדקו דוא״ל וסיסמה'; return; }
    token=r.data.session.access_token;
    showBoard(email); load();
  });
  $('password').addEventListener('keydown',function(e){ if(e.key==='Enter') $('loginBtn').click(); });

  $('logoutBtn').addEventListener('click', async function(){ await client.auth.signOut(); location.reload(); });

  (async function init(){
    var s=(await client.auth.getSession()).data.session;
    if(s){ token=s.access_token; showBoard(s.user.email); load(); }
  })();
})();
</script>
</body>
</html>
