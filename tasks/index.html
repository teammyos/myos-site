<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MyOS משימות</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#1f1f1f;--mut:#5f6368;--line:#e3e6ea;--acc:#0b57d0;--acc-bg:#e8f0fe;--red:#c5221f;--red-bg:#fce8e6;--amb:#b06000;--amb-bg:#fef7e0;--grn:#137333;--hover:#f1f3f4;--r:16px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;border-radius:20px;padding:7px 14px}
button:hover{background:var(--hover)}
button.pri{background:var(--acc);color:#fff}button.pri:hover{background:#0842a0}
button.out{border:1px solid var(--line);background:#fff}
button.sm{padding:4px 10px;font-size:13px;white-space:nowrap}
button.danger{color:var(--red)}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-bg);border-color:var(--acc)}
.hid{display:none!important}
#app{display:grid;grid-template-columns:260px 1fr;height:100%}
#app.rail{grid-template-columns:60px 1fr}
aside{padding:10px 8px;overflow:auto;overflow-x:hidden}
.nav .ic{flex:none;width:24px;text-align:center}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#dde3ea;font-size:12px;font-weight:600}
.nav.on .av{background:var(--acc);color:#fff}
.rail aside .lb,.rail aside .sec button{display:none}
.rail aside .sec{height:1px;background:var(--line);margin:8px 10px;padding:0;font-size:0}
.rail .nav{justify-content:center;padding:8px 0;position:relative;gap:0}
.rail .nav .n{position:absolute;top:1px;inset-inline-end:4px;margin:0;font-size:10px;background:var(--bg);border-radius:8px;padding:0 3px}
.rail .nav .n.gear{display:none}
.rail .brand{justify-content:center;padding:6px 0 10px}
.brand{font-size:19px;padding:6px 6px 12px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand b{font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:22px;cursor:pointer;user-select:none}
.nav:hover{background:#e9eef6}.nav.on{background:#d3e3fd;font-weight:600}
.nav .n{margin-inline-start:auto;font-size:12px;color:var(--mut);font-weight:400}
.nav .n.bad{color:var(--red);font-weight:600}
.nav .n.gear{font-size:16px;line-height:1;padding:3px 6px;border-radius:8px;cursor:pointer;color:var(--ink);opacity:.7}
.nav .n.gear:hover{background:var(--line);opacity:1}
button.danger.out{border-color:var(--red)}
.warn{background:var(--amb-bg);color:var(--amb);border-radius:10px;padding:8px 11px;font-size:13px;margin:8px 0;display:flex;gap:8px;align-items:center}
.warn .sp{margin-inline-start:auto}
.sec{font-size:12px;color:var(--mut);padding:16px 14px 4px;display:flex;align-items:center}
.sec button{margin-inline-start:auto;padding:2px 8px;font-size:18px;line-height:1}
main{padding:14px 16px 14px 6px;overflow:auto;display:flex;gap:14px;align-items:flex-start}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.08);flex:1;min-width:0;max-width:760px}
.card h1{font-size:18px;font-weight:500;margin:0;padding:16px 20px 6px;display:flex;align-items:center;gap:8px}
.card h1 small{font-size:12px;color:var(--mut);font-weight:400}
.card h1 .sp{margin-inline-start:auto}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:4px 20px 8px;align-items:center}
.chip{border:1px solid var(--line);border-radius:16px;padding:3px 10px;font-size:12.5px;background:#fff;cursor:pointer;user-select:none;white-space:nowrap}
.chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.chip.red{background:var(--red-bg);border-color:transparent;color:var(--red)}
.chip.amb{background:var(--amb-bg);border-color:transparent;color:var(--amb)}
.chip.plain{cursor:default}
select.chip{width:auto;padding:3px 8px}
.add{display:flex;align-items:center;gap:10px;padding:8px 20px;color:var(--acc);cursor:text}
.add input{border:0;padding:6px 0;outline:0!important;background:transparent}
.add .plus{font-size:20px;width:22px;text-align:center}
.addx{padding:0 52px 10px 20px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.addbox{margin:6px 16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:2px 0}
.addbox .add{padding:8px 14px}.addbox .addx{padding:0 14px 10px}
.newt{margin:2px 12px 10px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.rail .newt{margin:2px 6px 8px;padding:8px 0}
.lnk{display:inline-block;margin-top:5px;font-size:12.5px;color:var(--acc);cursor:pointer}
.cd.drop{outline:2px dashed var(--acc);outline-offset:-3px;background:var(--acc-bg)}
.ce[draggable=true]{cursor:grab}
.row{display:flex;gap:10px;padding:8px 20px;align-items:flex-start;border-top:1px solid transparent;cursor:pointer}
.row:hover{background:#f8fafd}.row.sel{background:var(--acc-bg)}
.ck{flex:none;width:20px;height:20px;border:2px solid #747775;border-radius:50%;margin-top:2px;display:grid;place-items:center;background:#fff;padding:0;font-size:13px;color:transparent}
.ck:hover{border-color:var(--acc);color:var(--acc);background:#fff}
.ck.done{background:var(--acc);border-color:var(--acc);color:#fff}
.ck.wait{border-style:dashed}
.row .tx{flex:1;min-width:0}
.row .t{overflow-wrap:anywhere}
.row.fin .t{text-decoration:line-through;color:var(--mut)}
.row .s{font-size:12.5px;color:var(--mut);margin-top:2px;overflow-wrap:anywhere}
.row .m{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.star{flex:none;padding:2px 6px;font-size:17px;color:#9aa0a6}.star.on{color:var(--acc)}
.grp{padding:12px 20px 4px;font-size:12.5px;color:var(--mut);cursor:pointer;user-select:none}
.empty{padding:36px 20px 44px;text-align:center;color:var(--mut)}
.fl{margin-inline-end:5px}.fl.hi{color:var(--red)}.fl.lo{color:#9aa0a6}
.row{border-inline-start:3px solid transparent}.row.p-hi{border-inline-start-color:var(--red)}.row.p-lo .t{color:var(--mut)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.card.wide{max-width:1180px}
.trow{display:grid;grid-template-columns:22px minmax(0,2.4fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr) 128px 104px;gap:10px;align-items:center;padding:6px 16px;font-size:13.5px;border-top:1px solid var(--line);border-inline-start:4px solid transparent}
.trow > div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.th{font-size:12px;color:var(--mut);border-top:0;padding-top:10px}
.trow .ck{margin-top:0}.trow .mu{color:var(--mut)}
.trow.s-red{border-inline-start-color:var(--red)}.trow.s-amb{border-inline-start-color:#e8a000}.trow.s-acc{border-inline-start-color:var(--acc)}
.trow .d-red{color:var(--red);font-weight:600}
@media (max-width:900px){#tg_tbl{display:none}}
#nod{flex:none;width:330px;max-width:none;position:sticky;top:0;max-height:calc(100vh - 28px);overflow:auto}
#nod h1{font-size:15px}
#nod .row{padding-inline:14px}
#det{width:400px;flex:none;background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.08);padding:14px 18px 18px;position:sticky;top:0;max-height:calc(100vh - 28px);overflow:auto}
#det .top{display:flex;align-items:center;gap:4px;margin:-4px -8px 4px}
#det .top .sp{margin-inline-start:auto}
#det textarea.title{font-size:18px;border-color:transparent;resize:none;padding:4px 6px;margin:0 -6px;width:calc(100% + 12px)}
#det textarea.title:hover{border-color:var(--line)}
.lbl{font-size:12px;color:var(--mut);margin:14px 0 4px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:6px 8px;align-items:center;margin-top:8px}
.kv>span{font-size:12.5px;color:var(--mut)}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.box.act{border-color:var(--acc);background:#fbfcff}
.box.wt{border-color:#f2c94c;background:#fffdf5}
.quick{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.quick input[type=date]{width:auto;padding:3px 6px;font-size:12.5px}
.stp{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:13px}
.stp .x{margin-inline-start:auto;padding:0 6px;color:var(--mut)}
.stp.done{color:var(--mut)}.stp.done span.tt{text-decoration:line-through}
.tl{font-size:12.5px;border-inline-start:2px solid var(--line);padding-inline-start:10px;margin-top:6px}
.tl div{padding:3px 0}.tl time{color:var(--mut);margin-inline-end:6px}
.tl .note{background:#f8f9fa;border-radius:8px;padding:5px 8px;margin:3px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
#toast{position:fixed;bottom:22px;inset-inline-start:22px;background:#303134;color:#fff;border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:50;max-width:92vw}
#toast button{color:#8ab4f8;padding:2px 6px}#toast button:hover{background:#3c4043}
.ovl{position:fixed;inset:0;background:rgba(32,33,36,.45);display:grid;place-items:center;z-index:40;padding:14px}
.dlg{background:#fff;border-radius:20px;padding:20px 22px;width:460px;max-width:100%;max-height:92vh;overflow:auto}
.dlg h2{margin:0 0 4px;font-size:18px;font-weight:500}
.dlg p{color:var(--mut);margin:2px 0 10px}
.dlg .f{margin-top:10px}.dlg .f>label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
.dlg .btns{display:flex;gap:8px;justify-content:flex-start;margin-top:18px;flex-direction:row-reverse}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.opt.on{border-color:var(--acc);background:var(--acc-bg)}
.opt b{font-weight:600}.opt small{display:block;color:var(--mut)}
#login{display:grid;place-items:center;height:100%;padding:16px}
#login .dlg{box-shadow:0 1px 3px rgba(0,0,0,.15)}
.demo{background:#fef7e0;color:#5f4400;padding:6px 14px;font-size:12.5px;display:flex;gap:10px;align-items:center;grid-column:1/-1}
.demo select{width:auto;padding:2px 6px}
.ppl{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.ppl .sp{margin-inline-start:auto}
.fb{border-top:1px solid var(--line);padding:9px 0;font-size:13px}
.fb .fh{display:flex;gap:8px;align-items:center}.fb .sp{margin-inline-start:auto}
.fb small{color:var(--mut)}
.fbody{white-space:pre-wrap;margin-top:4px;overflow-wrap:anywhere}
.fnote{margin-top:6px;background:var(--acc-bg);border-radius:8px;padding:6px 9px;white-space:pre-wrap}
.fa{display:flex;gap:6px;margin-top:7px}.fa select{width:auto}
.fbt{margin-top:20px;font-size:12.5px;color:var(--mut);padding-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:6px}
.cal>div{background:#fff;min-width:0}
.cw{font-size:12px;color:var(--mut);text-align:center;padding:5px 0}
.cd{min-height:92px;padding:4px 5px;cursor:pointer}
.cd.x{cursor:default;background:#fbfbfc}
.cal>.sat{background:#f6f8fb}
.cd.sel{outline:2px solid var(--acc);outline-offset:-2px}
.cn{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:2px;gap:4px}
.cn b{font-weight:500;min-width:22px;height:22px;display:inline-grid;place-items:center;border-radius:50%}
.cd.tod .cn b{background:var(--acc);color:#fff}
.cn span{color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden}
.ce{font-size:11.5px;background:var(--acc-bg);color:#0842a0;border-radius:5px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce.red{background:var(--red-bg);color:var(--red)}.ce.amb{background:var(--amb-bg);color:var(--amb)}
.cm{font-size:11px;color:var(--mut);margin-top:2px}
.menu{padding:6px 10px;font-size:18px;border-radius:50%}
#shade{display:none}
@media (max-width:900px){
 #app,#app.rail{grid-template-columns:56px 1fr}
 #app:not(.rail) aside{position:fixed;inset:0 0 0 auto;width:272px;background:var(--bg);z-index:30;box-shadow:0 0 20px rgba(0,0,0,.25)}
 #shade{display:block;position:fixed;inset:0;background:rgba(32,33,36,.35);z-index:29}
 main{padding:8px 8px 8px 4px;display:block;grid-column:2}
 #det{position:fixed;inset:0;width:auto;max-height:none;border-radius:0;z-index:35}
 .cd{min-height:60px;padding:2px}.ce{font-size:10px;padding:0 3px}.cn span{font-size:10px}
}
</style>
</head>
<body>
<div id="login" class="hid"></div>
<div id="app" class="hid">
  <div id="demo" class="demo hid"></div>
  <div id="shade" class="hid" onclick="toggleSide(false)"></div>
  <aside id="side"></aside>
  <main><section class="card" id="list"></section><section class="card hid" id="nod"></section><section id="det" class="hid"></section></main>
</div>
<div id="toast" class="hid"></div>
<div id="modal"></div>
<datalist id="wo_dl"></datalist>
<script src="config.js"></script>
<script src="../js/supabase.umd.js"></script>
<script>
"use strict";
/* =====================================================================
   MyOS משימות – גרסה 2. קובץ אחד, בלי שלב בנייה.
   הלקוח קורא מהטבלאות (RLS) וכותב רק דרך פונקציות השרת (rpc).
   ?demo=1 – מצב הדגמה עם נתוני דוגמה בזיכרון, בלי שרת.
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => ((Math.random() * 16) | 0).toString(16)));
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const plus = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const plusW = n => { const d = new Date(); d.setDate(d.getDate() + n); if (d.getDay() === 6) d.setDate(d.getDate() + 1); return iso(d); }; // תאריך אוטומטי לא נופל על שבת
const nextWeek = () => { const d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7)); return iso(d); }; // יום ראשון הבא
const fmtD = s => { if (!s) return ''; if (s === today()) return 'היום'; if (s === plus(1)) return 'מחר'; if (s === plus(-1)) return 'אתמול';
  return new Date(s + 'T12:00').toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'short' }); };
const fmtT = s => new Date(s).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });

const ERR = { user_has_activity: 'למשתמש הזה כבר יש פעילות במערכת, ולכן אפשר רק להשבית אותו', deactivate_first: 'קודם משביתים את המשתמש, ורק אז אפשר למחוק', cannot_delete_self: 'אי אפשר למחוק את עצמך', cannot_delete_admin: 'אי אפשר למחוק מנהל מערכת', user_not_found: 'המשתמש כבר לא קיים', reason_required: 'צריך לכתוב סיבה לשינוי התאריך', personal_space: 'אי אפשר למחוק את המרחב האישי', too_many_invites: 'נשלחו הרבה הזמנות היום. אפשר להמשיך מחר', feedback_empty: 'חסר נושא או פירוט', feedback_too_many: 'נשלחו הרבה פניות היום. אפשר לנסות שוב מחר', admins_only: 'רק מנהל מערכת יכול לעשות את זה', owner_only: 'רק אחראי המשימה או מנהל המרחב יכולים לעשות את זה', waiting_needs_followup_date: 'להמתנה חייבים לקבוע תאריך מעקב',
  stale_version: 'מישהו עדכן את המשימה בינתיים. רענן ונסה שוב', user_not_found: 'אין משתמש רשום עם המייל הזה. הוא צריך להירשם קודם',
  not_approved: 'החשבון ממתין לאישור מנהל', managers_only: 'רק מנהל המרחב יכול לעשות את זה', step_not_active: 'הפעולה כבר לא פעילה. רענן',
  later_step_done: 'אי אפשר לבטל: כבר בוצעה פעולה מאוחרת יותר', not_found: 'המשימה לא נמצאה או שאין לך גישה אליה', admins_only: 'רק מנהל מערכת',
  task_closed: 'המשימה סגורה. פתח אותה מחדש כדי להוסיף פעולה', not_a_member: 'אינך חבר במרחב הזה', empty_note: 'ההערה ריקה',
  bad_email: 'כתובת המייל לא תקינה', email_not_confirmed: 'המשתמש נרשם אבל עוד לא אימת את המייל שלו' };
const errMsg = e => { const m = String(e && e.message || e); for (const k in ERR) if (m.includes(k)) return ERR[k]; return 'משהו השתבש: ' + m; };

const S = { me: null, profile: null, spaces: [], members: [], people: [], projects: [], board: [], profiles: [], invites: [], recs: [], feedback: [], delreqs: [], q: '', adv: false, cal: { y: new Date().getFullYear(), m: new Date().getMonth(), day: null, mine: false },
  view: 'mine', space: null, sel: null, det: null, f: { who: '', overdue: false, when: '', project: '', status: '', owner: '', from: '', to: '', prio: '', sort: '' }, showDone: false, showNod: true, showTl: false, adding: false, demo: false };
let api;

/* ------------------------------------------------------------ שרת אמיתי */
function realApi() {
  const c = window.MYOS_SUPABASE, sb = supabase.createClient(c.url, c.publishableKey);
  const q = async p => { const { data, error } = await p; if (error) throw error; return data; };
  return {
    async user() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
    google: () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } }),
    signIn: (email, password) => q(sb.auth.signInWithPassword({ email, password })),
    signUp: (email, password, name) => q(sb.auth.signUp({ email, password, options: { data: { full_name: name }, emailRedirectTo: location.origin + location.pathname } })),
    signOut: () => sb.auth.signOut(),
    rpc: (fn, args) => q(sb.rpc(fn, args || {})),
    async load() {
      const [delreqs, feedback, recs, invites, spaces, members, people, projects, board, profiles] = await Promise.all([
        q(sb.from('space_delete_requests').select('*').eq('status', 'pending').order('requested_at')).catch(() => []),
        q(sb.from('feedback').select('*').order('created_at', { ascending: false })).catch(() => []),
        q(sb.from('recurrences').select('*').order('created_at')).catch(() => []),
        q(sb.from('invites').select('*')).catch(() => []),
        q(sb.from('spaces').select('*').is('archived_at', null).order('created_at')), q(sb.from('space_members').select('*')),
        q(sb.from('people').select('*').order('name')), q(sb.from('projects').select('*').order('created_at')),
        q(sb.from('board').select('*')), q(sb.from('profiles').select('*'))]);
      return { spaces, members, people, projects, board, profiles, invites, recs, feedback, delreqs };
    },
    async task(id) {
      const [steps, followups, events] = await Promise.all([
        q(sb.from('steps').select('*').eq('task_id', id).order('position')), q(sb.from('followups').select('*').eq('task_id', id).order('noted_at')),
        q(sb.from('events').select('*').eq('task_id', id).order('id'))]);
      return { steps, followups, events };
    }
  };
}

function mockApi() { throw new Error('demo data is not included in this build'); }

// פתיחת משימה עם כל הפרטים (רשות). ההוספה המהירה נשארת שורה אחת + Enter.
// רשימה שמודבקת או נכתבת בכמה שורות: כל שורה היא משימה. תבליטים ומספור בתחילת השורה מוסרים.
const taskLines = tx => {
  let s = String(tx || '').replace(new RegExp('\\r\\n?|[\\v\\f' + String.fromCharCode(0x85, 0x2028, 0x2029) + ']', 'g'), '\n');   // כל סוגי שבירת השורה (וורד, אאוטלוק, מק)
  if (!/\n/.test(s) && /\t/.test(s)) s = s.replace(/\t+/g, '\n');   // שורה שהועתקה מאקסל
  const out = [];
  for (const ln of s.split('\n')) {
    const marks = [...ln.matchAll(/(?:^|\s)(\d{1,2})[.)]\s+/g)];   // כמה פריטים ממוספרים באותה שורה: "1. א 2. ב 3. ג"
    if (marks.length > 1 && marks.every((m, i) => Number(m[1]) === Number(marks[0][1]) + i)) { marks.forEach((m, i) => out.push(ln.slice(m.index + m[0].length, i + 1 < marks.length ? marks[i + 1].index : ln.length))); continue; }
    if (/\s[•▪◦]\s/.test(ln)) { ln.split(/\s*[•▪◦]\s*/).forEach(x => out.push(x)); continue; }
    out.push(ln);
  }
  return out.map(x => x.replace(/^\s*(?:[-*•·▪◦–]|\d{1,3}[.)])\s*/, '').trim()).filter(Boolean);
};

  draw();
}

// פניות למנהל המערכת: כל משתמש שולח ורואה את הפניות של עצמו ואת התשובה. מנהל מערכת רואה את כולן, מעדכן מצב ועונה.
const FB_CAT = { improvement: 'הצעה לשיפור', feature: 'בקשה לתוספת', bug: 'תקלה', ui: 'תצוגה ונוחות', other: 'אחר' };
const FB_ST = { new: 'חדשה', in_progress: 'בטיפול', done: 'טופלה', declined: 'לא יבוצע' };
function feedbackDialog() {
  const adm = S.profile.is_admin, who = id => { const u = S.profiles.find(p => p.user_id === id) || {}; return u.full_name || u.email || ''; };
  const dt = s => new Date(s).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: '2-digit' });
  const item = f => `<div class="fb"><div class="fh"><b>${esc(f.subject)}</b><span class="sp"></span><span class="chip plain ${f.status === 'new' ? 'on' : f.status === 'in_progress' ? 'amb' : ''}">${FB_ST[f.status] || ''}</span></div>
    <small>${esc(FB_CAT[f.category] || '')} · ${dt(f.created_at)}${adm ? ' · ' + esc(who(f.user_id)) : ''}</small><div class="fbody">${esc(f.body)}</div>
    ${adm ? `<div class="fa"><select data-fs="${f.id}">${Object.keys(FB_ST).map(k => `<option value="${k}" ${f.status === k ? 'selected' : ''}>${FB_ST[k]}</option>`).join('')}</select><input type="text" data-fn="${f.id}" placeholder="תשובה למשתמש (רשות)" value="${esc(f.admin_note || '')}"><button class="sm" data-fv="${f.id}">שמור</button></div>`
      : f.admin_note ? `<div class="fnote">תשובת מנהל המערכת: ${esc(f.admin_note)}</div>` : ''}</div>`;
  const draw = () => dialog(`<h2>פנייה למנהל המערכת</h2><p>תקלה, הצעה לשיפור או בקשה לתוספת. הפנייה מגיעה למנהלי המערכת, והתשובה תופיע כאן.</p>
    <div class="f"><label>סוג הפנייה</label><select id="fb_c">${Object.keys(FB_CAT).map(k => `<option value="${k}">${FB_CAT[k]}</option>`).join('')}</select></div>
    <div class="f"><label>נושא</label><input type="text" id="fb_s" maxlength="200"></div>
    <div class="f"><label>פירוט</label><textarea id="fb_b" rows="4" maxlength="5000" placeholder="מה ניסית לעשות, ומה קרה או מה חסר"></textarea></div>
    <div class="btns"><button class="pri" id="ok">שליחה</button><button id="no">סגור</button></div>
    ${S.feedback.length ? `<div class="fbt">${adm ? 'כל הפניות' : 'הפניות שלי'} (${S.feedback.length})</div>` + S.feedback.map(item).join('') : ''}`, dlg => {
    $('#no', dlg).onclick = closeDialog;
    $('#ok', dlg).onclick = async () => { const s = $('#fb_s', dlg).value.trim(), b = $('#fb_b', dlg).value.trim(); if (!s || !b) return toast(ERR.feedback_empty);
      $('#ok', dlg).disabled = true;
      try { await call('send_feedback', { p_category: $('#fb_c', dlg).value, p_subject: s, p_body: b, p_page: S.view, p_request: uid() }, 'הפנייה נשלחה. תודה'); draw(); } catch (e) { $('#ok', dlg).disabled = false; } };
    dlg.querySelectorAll('[data-fv]').forEach(x => x.onclick = async () => { const id = x.dataset.fv;
      try { await call('admin_set_feedback', { p_id: id, p_status: dlg.querySelector(`[data-fs="${id}"]`).value, p_note: dlg.querySelector(`[data-fn="${id}"]`).value }, 'נשמר'); draw(); } catch (e) {} }); });
  draw();
}

/* ------------------------------------------------------------ כניסה */
function loginScreen(msg) {
  $('#app').classList.add('hid'); const L = $('#login'); L.classList.remove('hid');
  L.innerHTML = `<div class="dlg"><h2><span style="color:var(--acc)">✓</span> MyOS משימות</h2><p>${esc(msg || 'כל משימה נרשמת פעם אחת, ותמיד ברור מה הצעד הבא ואצל מי.')}</p>
    <button class="out" id="g" style="width:100%;padding:10px">כניסה עם Google</button>
    <div class="f"><label>מייל</label><input type="email" id="le" autocomplete="username"></div>
    <div class="f"><label>סיסמה</label><input type="password" id="lp" autocomplete="current-password"></div>
    <div class="f hid" id="lnw"><label>שם מלא</label><input type="text" id="ln"></div>
    <div class="btns"><button class="pri" id="li">כניסה</button><button id="ls">הרשמה</button></div>
    <p style="margin-top:14px;font-size:12px"><a href="privacy.html">מדיניות פרטיות</a></p></div>`;
  $('#g').onclick = () => api.google();
  const go = async up => { const e = $('#le').value.trim(), p = $('#lp').value; if (!e || !p) return toast('חסר מייל או סיסמה');
    try { if (up) { if ($('#lnw').classList.contains('hid')) { $('#lnw').classList.remove('hid'); $('#ln').focus(); return; } await api.signUp(e, p, $('#ln').value.trim()); toast('נרשמת. אם נשלח אליך מייל אימות – אשר אותו, ואז היכנס'); } else { await api.signIn(e, p); start(); } }
    catch (x) { toast(/Invalid login/i.test(x.message) ? 'מייל או סיסמה שגויים' : errMsg(x)); } };
  $('#li').onclick = () => go(false); $('#ls').onclick = () => go(true); $('#lp').onkeydown = e => { if (e.key === 'Enter') go(false); };
}
async function start() {
  const u = await api.user(); if (!u) return loginScreen();
  S.me = u.id;
  try { S.profile = await api.rpc('ensure_setup'); } catch (e) { return loginScreen(errMsg(e)); }
  if (!S.profile.approved) { loginScreen('החשבון ' + (S.profile.email || '') + ' נרשם וממתין לאישור מנהל. אחרי האישור רענן את הדף.'); $('#g').outerHTML = '<button class="out" id="so" style="width:100%;padding:10px">יציאה והחלפת חשבון</button>'; $('#so').onclick = () => api.signOut().then(() => location.reload()); return; }
  $('#login').classList.add('hid'); $('#app').classList.remove('hid');
  if (S.demo) { const d = $('#demo'); d.classList.remove('hid');
    d.innerHTML = `<b>הדגמה</b> נתוני דוגמה בלבד, שום דבר לא נשמר. צפייה בתור: <select id="as">${api.users.map(x => `<option value="${x.user_id}" ${x.user_id === S.me ? 'selected' : ''}>${esc(x.full_name)}${x.user_id === 'u1' ? ' (מנהל)' : ' (עובד)'}</option>`).join('')}</select>`;
    $('#as').onchange = e => { api.as(e.target.value); S.sel = null; S.det = null; S.space = null; start(); }; }
  await refresh();
}
// השלמת שמות בשדה "על מי מחכים": האנשים של אותו מרחב. עובד עם חשבון יקבל מייל ויראה את המשימה אצלו.
document.addEventListener('focusin', e => { const el = e.target, sp = el && el.dataset ? el.dataset.wo : null; if (!sp) return;
  $('#wo_dl').innerHTML = S.people.filter(p => p.space_id === sp && p.active && p.user_id !== S.me).map(p => `<option value="${esc(p.name)}">${p.user_id ? 'עובד במרחב – יקבל מייל' : 'גורם חיצוני'}</option>`).join(''); });
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => { const a = document.activeElement; if (S.spaces.length && !$('#modal').innerHTML && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) renderList(); }, 200); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (narrow() && !S.rail) toggleSide(false); else if ($('#modal').innerHTML) closeDialog(); else if (S.sel && !(document.activeElement && document.activeElement.id === 'q')) { S.sel = null; S.det = null; render(); } } });
(function boot() {
  try { S.table = localStorage.getItem('myos_table') === '1'; } catch (e) {}
  S.rail = narrow(); try { const r = localStorage.getItem('myos_rail'); if (r && !narrow()) S.rail = r === '1'; } catch (e) {}
  S.demo = false;
  if (!window.MYOS_SUPABASE || !window.supabase) return loginScreen('המערכת לא נטענה במלואה. רענן את הדף; אם זה חוזר, ייתכן שהסינון חוסם קובץ.');
  api = S.demo ? mockApi() : realApi();
  start().catch(e => loginScreen(errMsg(e)));
})();
</script>
</body>
