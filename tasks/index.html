<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>מטרות ומשימות</title>
  <style>
    :root{--ink:#162231;--navy:#173854;--gold:#c99516;--bg:#f4f7fa;--line:#dce4eb;--muted:#718092;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;font-size:16px}
    button,input,select{font:inherit}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
    .topin,.wrap{max-width:1400px;margin:auto;padding:18px 28px}.topin{display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;font-size:22px}.brand b{font-size:20px}.muted{color:var(--muted);font-size:14px}
    nav{display:flex;gap:5px;background:#eef3f7;padding:4px;border-radius:13px}nav button{border:0;background:transparent;padding:10px 15px;border-radius:10px;cursor:pointer;color:#536476}nav button.active{background:white;color:var(--navy);box-shadow:0 1px 4px #ccd5dd}
    .wrap{padding-top:36px}.heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}.eyebrow{color:#a87909;font-weight:700;font-size:14px}.heading h1{margin:5px 0 0;font-size:32px}.actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid var(--navy);border-radius:10px;padding:11px 17px;background:white;color:var(--navy);font-weight:700;cursor:pointer}.btn.primary{background:var(--navy);color:white}.btn.small{padding:8px 11px;font-size:14px}.btn.danger{border-color:#b42318;color:#b42318}
    .summary{display:grid;grid-template-columns:repeat(2,minmax(0,210px));gap:12px;margin-bottom:24px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:17px}.stat strong{display:block;font-size:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .card{background:white;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 8px 24px rgba(23,56,84,.06)}.cardtop{display:flex;justify-content:space-between;gap:12px}.card h2{font-size:20px;margin:10px 0 0}.next{background:#f3f7fa;border-radius:12px;padding:15px;margin:20px 0}.next b{display:block;margin-top:6px}.meta{display:flex;gap:22px;flex-wrap:wrap;color:#607083;font-size:14px}
    .status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 10px;background:#e8f6ee;color:#217a49;font-size:13px;font-weight:700}.status.waiting{background:#fff6df;color:#8a6509}.status.done{background:#edf1f4;color:#586776}
    .filters{display:flex;gap:10px;background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}.filters input{flex:1}.control{width:100%;border:1px solid #cdd8e1;border-radius:9px;padding:10px;background:white}
    .tablebox{overflow:auto;background:white;border:1px solid var(--line);border-radius:16px}table{border-collapse:collapse;width:100%;min-width:840px}th,td{text-align:right;padding:14px;border-bottom:1px solid #e6edf2}th{background:#f8fafb;color:#536476}.empty{text-align:center;background:white;border:1px dashed #aebdca;border-radius:18px;padding:55px;color:var(--muted)}
    dialog{border:0;border-radius:18px;width:min(560px,calc(100% - 28px));padding:0;box-shadow:0 25px 80px #172b3e55}dialog::backdrop{background:#10203077}.modal{padding:24px}.modal h2{margin:0 0 6px}.form{display:grid;gap:14px;margin-top:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:7px;font-weight:700;font-size:14px}.modalfoot{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.hidden{display:none!important}.msg{border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.55;background:#eef3f7;color:#3a4a5c;margin-bottom:18px}.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}.gmark{width:19px;height:19px;flex:none}.sep{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:13px}.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--line)}.msg.err{background:#fdeceb;color:#a3251c}.msg.ok{background:#e8f6ee;color:#1d6b41}.msg.wait{background:#fff6df;color:#7d5c08}.msg a{color:inherit}
    @media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.topin,.wrap{padding-right:16px;padding-left:16px}.topin,.heading{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.filters{flex-direction:column}.heading h1{font-size:27px}}
  </style>
</head>
<body>
  <section id="loginScreen" class="wrap" style="max-width:480px;padding-top:80px">
    <div class="card"><div class="brand" style="margin-bottom:24px"><div class="logo">✓</div><div><b>כניסה למערכת המשימות</b><div class="muted">עם חשבון גוגל או עם מייל וסיסמה</div></div></div>
      <div id="loginMessage" class="msg hidden"></div><div id="loginChoices"><button type="button" id="googleBtn" class="btn gbtn"><svg class="gmark" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.8 2.6 13.6l7.8 6c1.9-5.7 7.2-10.1 13.6-10.1z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.15-3.2-.44-4.7H24v9h12.7c-.55 3-2.2 5.5-4.7 7.2l7.5 5.8c4.4-4.1 7-10.1 7-17.3z"/><path fill="#FBBC05" d="M10.4 28.4c-.5-1.4-.8-2.9-.8-4.4s.3-3 .8-4.4l-7.8-6C1 16.7 0 20.2 0 24s1 7.3 2.6 10.4l7.8-6z"/><path fill="#34A853" d="M24 47.5c6.2 0 11.5-2 15.3-5.6l-7.5-5.8c-2.1 1.4-4.8 2.2-7.8 2.2-6.4 0-11.7-4.3-13.6-10.1l-7.8 6C6.5 42.2 14.6 47.5 24 47.5z"/></svg>המשך עם Google</button><div class="sep"><span>או באמצעות מייל וסיסמה</span></div><form id="loginForm" class="form"><label>דואר אלקטרוני<input id="loginEmail" type="email" class="control" required></label><label>סיסמה<input id="loginPassword" type="password" class="control" minlength="6" required></label><button class="btn primary">כניסה</button><button type="button" id="signupBtn" class="btn">הרשמה</button></form></div>
    </div>
  </section>
  <div id="appShell" class="hidden">
  <header class="top"><div class="topin"><div class="brand"><div class="logo">✓</div><div><b>מטרות ומשימות</b><div class="muted">מה מקדמים עכשיו</div></div></div><nav><button data-view="board" class="active">לוח עבודה</button><button data-view="all">כל המשימות</button><button id="teamBtn">צוות</button><button id="logoutBtn" title="יציאה">יציאה</button></nav></div></header>
  <main class="wrap">
    <div class="heading"><div><div class="eyebrow" id="eyebrow">לוח עבודה</div><h1 id="title">המשימות הפתוחות</h1></div><div class="actions"><button class="btn primary" data-new="task">＋ משימה חדשה</button><button class="btn" data-new="goal">＋ פרויקט חדש</button></div></div>
    <section id="boardView"><div class="summary"><div class="stat"><strong id="taskCount">0</strong><span class="muted">משימות פתוחות</span></div><div class="stat"><strong id="goalCount">0</strong><span class="muted">מטרות פעילות</span></div></div><div id="cards" class="grid"></div></section>
    <section id="allView" class="hidden"><div class="filters"><input id="search" class="control" placeholder="חיפוש לפי משימה, מטרה או אחראי"><select id="filter" class="control" style="max-width:190px"><option value="all">כל המצבים</option><option value="active">פעיל</option><option value="waiting">ממתין</option><option value="done">הסתיים</option></select></div><div class="tablebox"><table><thead><tr><th>שם</th><th>סוג</th><th>שייך ל</th><th>פעולה נוכחית</th><th>אחראי</th><th>מצב</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </main>
  </div>
  <dialog id="itemDialog"><form method="dialog" class="modal" id="itemForm"><h2 id="formTitle">משימה חדשה</h2><div class="muted">מגדירים רק את הצעד הבא שמקדם את המשימה.</div><div class="form"><input type="hidden" id="itemId"><label>שם<input id="itemTitle" class="control" required></label><div class="row"><label>סוג<select id="itemType" class="control"><option value="task">משימה</option><option value="goal">מטרה/פרויקט</option></select></label><label>שייך למטרה/פרויקט<select id="parent" class="control"></select></label></div><label>הפעולה הבאה<input id="action" class="control"></label><div class="row"><label>אחראי<select id="owner" class="control"></select></label><label>תאריך יעד<input id="due" type="date" class="control"></label></div><label>מצב<select id="itemStatus" class="control"><option value="active">פעיל</option><option value="waiting">ממתין</option><option value="done">הסתיים</option></select></label><div class="modalfoot"><button type="button" id="deleteItem" class="btn danger hidden">מחיקה</button><span></span><div class="actions"><button value="cancel" class="btn">ביטול</button><button value="default" id="saveItem" class="btn primary">שמירה</button></div></div></div></form></dialog>
  <dialog id="teamDialog"><form method="dialog" class="modal"><h2>ניהול צוות</h2><div class="muted">השמות יופיעו ברשימת האחראים.</div><div class="form"><div class="row"><input id="memberName" class="control" placeholder="שם איש צוות"><button type="button" id="addMember" class="btn primary">הוספה</button></div><div id="members"></div><div class="modalfoot"><span></span><button class="btn">סגירה</button></div></div></form></dialog>
  <script src="../js/supabase.umd.js"></script>
  <script src="config.js"></script>
  <script>
  (async()=>{
    const cfg=window.MYOS_SUPABASE||{};
    if(!cfg.url||!cfg.publishableKey||cfg.publishableKey.includes('PASTE_')){document.querySelector('#loginMessage').textContent='יש להשלים את פרטי Supabase בקובץ config.js';return}
    const db=window.supabase.createClient(cfg.url,cfg.publishableKey);
    let items=[], team=[], view='board', user=null;
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function load(){const [{data:a,error:e1},{data:t,error:e2}]=await Promise.all([db.from('items').select('*').order('created_at',{ascending:false}),db.from('team_members').select('*').order('name')]);if(e1||e2){alert((e1||e2).message);return}items=(a||[]).map(x=>({id:x.id,title:x.title,type:x.type,parent:x.parent_id||'',action:x.action_title||'',owner:x.action_owner||'',due:x.due_date||'',status:x.status}));team=(t||[]).map(x=>x.name);render()}
    const save=()=>render();
    const label=s=>({active:'פעיל',waiting:'ממתין',done:'הסתיים'}[s]||s), date=s=>s?s.split('-').reverse().join('/'):'ללא תאריך';
    function status(s){return `<span class="status ${esc(s)}">● ${label(s)}</span>`}
    function render(){
      const open=items.filter(x=>x.type==='task'&&x.status!=='done'), goals=items.filter(x=>x.type==='goal'&&x.status==='active');
      $('#taskCount').textContent=open.length;$('#goalCount').textContent=goals.length;
      $('#cards').innerHTML=open.length?open.map(x=>`<article class="card"><div class="cardtop"><div>${status(x.status)}<h2>${esc(x.title)}</h2></div><button class="btn small" data-complete="${x.id}">✓ סמן כבוצע</button></div><div class="next"><span class="muted">הפעולה הבאה</span><b>${esc(x.action||'לא הוגדרה פעולה')}</b></div><div class="meta"><span>👤 ${esc(x.owner||'ללא אחראי')}</span><span>🗓 ${date(x.due)}</span><button class="btn small" data-edit="${x.id}">עריכה</button></div></article>`).join(''):'<div class="empty">אין כרגע משימות פתוחות</div>';
      const q=$('#search').value.trim(), f=$('#filter').value; const filtered=items.filter(x=>(f==='all'||x.status===f)&&(!q||[x.title,x.action,x.owner].some(v=>(v||'').includes(q))));
      $('#rows').innerHTML=filtered.map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${x.type==='goal'?'מטרה/פרויקט':'משימה'}</td><td>${esc(items.find(y=>y.id===x.parent)?.title||'—')}</td><td>${esc(x.action||'—')}</td><td>${esc(x.owner||'—')}</td><td>${status(x.status)}</td><td><button class="btn small" data-edit="${x.id}">עריכה</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:40px">לא נמצאו פריטים</td></tr>';
    }
    function options(selected=''){const goals=items.filter(x=>x.type==='goal');$('#parent').innerHTML='<option value="">ללא שיוך</option>'+goals.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.title)}</option>`).join('');$('#owner').innerHTML='<option value="">ללא אחראי</option>'+team.map(n=>`<option ${n===selected?'selected':''}>${esc(n)}</option>`).join('')}
    function openItem(kind='task',id=''){const x=items.find(y=>y.id===id);options(x?.parent||'');$('#itemId').value=x?.id||'';$('#itemTitle').value=x?.title||'';$('#itemType').value=x?.type||kind;$('#action').value=x?.action||'';$('#owner').value=x?.owner||'';$('#due').value=x?.due||'';$('#itemStatus').value=x?.status||'active';$('#formTitle').textContent=x?'עריכת פריט':kind==='goal'?'פרויקט חדש':'משימה חדשה';$('#deleteItem').classList.toggle('hidden',!x);$('#itemDialog').showModal()}
    document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===view));$('#boardView').classList.toggle('hidden',view!=='board');$('#allView').classList.toggle('hidden',view!=='all');$('#eyebrow').textContent=view==='board'?'לוח עבודה':'ניהול';$('#title').textContent=view==='board'?'המשימות הפתוחות':'כל המטרות והמשימות'}if(b.dataset.new)openItem(b.dataset.new);if(b.dataset.edit)openItem('',b.dataset.edit);if(b.dataset.complete){const {error}=await db.from('items').update({status:'done',updated_at:new Date().toISOString()}).eq('id',b.dataset.complete);if(error){alert(error.message);return}await load()}});
    $('#saveItem').addEventListener('click',async e=>{e.preventDefault();if(!$('#itemTitle').value.trim())return;const id=$('#itemId').value;const row={title:$('#itemTitle').value.trim(),type:$('#itemType').value,parent_id:$('#parent').value||null,action_title:$('#action').value.trim(),action_owner:$('#owner').value,due_date:$('#due').value||null,status:$('#itemStatus').value,updated_at:new Date().toISOString()};const q=id?db.from('items').update(row).eq('id',id):db.from('items').insert({...row,created_by:user.id});const {error}=await q;if(error){alert(error.message);return}await load();$('#itemDialog').close()});
    $('#deleteItem').onclick=async()=>{const {error}=await db.from('items').delete().eq('id',$('#itemId').value);if(error){alert(error.message);return}await load();$('#itemDialog').close()};$('#search').oninput=render;$('#filter').onchange=render;$('#teamBtn').onclick=()=>{$('#members').innerHTML=team.map((n,i)=>`<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee"><span>${esc(n)}</span><button type="button" class="btn small danger" data-member="${i}">מחיקה</button></div>`).join('')||'<div class="muted">טרם נוספו עובדים</div>';$('#teamDialog').showModal()};
    $('#addMember').onclick=async()=>{const n=$('#memberName').value.trim();if(n&&!team.includes(n)){const {error}=await db.from('team_members').insert({name:n,created_by:user.id});if(error){alert(error.message);return}$('#memberName').value='';await load();$('#teamDialog').close();$('#teamBtn').click()}};$('#members').onclick=async e=>{const b=e.target.closest('[data-member]');if(b){const {error}=await db.from('team_members').delete().eq('name',team[Number(b.dataset.member)]);if(error){alert(error.message);return}await load();$('#teamDialog').close();$('#teamBtn').click()}};
    async function enter(){if(!$('#appShell').classList.contains('hidden'))return;const {data}=await db.auth.getUser();user=data.user;if(!user)return;const {data:tu}=await db.from('task_users').select('approved').eq('id',user.id).maybeSingle();if(!tu||!tu.approved){$('#loginChoices').classList.add('hidden');msg('<b>ההתחברות הצליחה.</b><br>החשבון <b>'+esc(user.email)+'</b> ממתין לאישור מנהל המערכת. עד שיאושר לא ניתן לראות את המשימות.<br>למנהל: לאשר ב-Supabase → task_users.<br><a href="#" id="pendingLogout">התנתקות מהחשבון</a>','wait');$('#pendingLogout').onclick=async e=>{e.preventDefault();await db.auth.signOut();location.reload()};return}$('#loginScreen').classList.add('hidden');$('#appShell').classList.remove('hidden');await load()}
    $('#logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};
    function msg(html,kind){const m=$('#loginMessage');m.className='msg '+(kind||'');m.innerHTML=html}
    const heb=e=>{const s=(e&&e.message)||'';if(/Invalid login credentials/i.test(s))return 'המייל או הסיסמה שגויים.';if(/Email not confirmed/i.test(s))return 'החשבון עדיין לא אומת. בדקו את תיבת המייל ולחצו על קישור האישור.';if(/User already registered/i.test(s))return 'הכתובת הזו כבר רשומה — אפשר להתחבר איתה.';if(/Password should be/i.test(s))return 'הסיסמה קצרה מדי (לפחות 6 תווים).';if(/rate limit|Too many/i.test(s))return 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.';if(/provider is not enabled|Unsupported provider/i.test(s))return 'ההתחברות עם גוגל עדיין לא הופעלה בפרויקט Supabase (Authentication ← Providers ← Google).';if(/Anonymous sign-ins are disabled/i.test(s))return 'יש למלא מייל וסיסמה.';return s||'שגיאה לא מזוהה.'};
    $('#loginForm').onsubmit=async e=>{e.preventDefault();msg('מתחבר…');const {error}=await db.auth.signInWithPassword({email:$('#loginEmail').value.trim(),password:$('#loginPassword').value});if(error){msg(heb(error),'err');return}await enter()};
    $('#googleBtn').onclick=async()=>{msg('מעביר לגוגל…');const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/tasks/'}});if(error)msg(heb(error),'err')};
    $('#signupBtn').onclick=async()=>{const email=$('#loginEmail').value.trim(),password=$('#loginPassword').value;if(!email||password.length<6){msg('כדי להירשם יש למלא מייל וסיסמה באורך 6 תווים לפחות.','err');return}msg('נרשם…');const {data,error}=await db.auth.signUp({email,password});if(error){msg(heb(error),'err');return}
      if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){msg('הכתובת <b>'+esc(email)+'</b> כבר רשומה במערכת. אפשר להתחבר איתה בכפתור «כניסה».','err');return}
      if(data.session){await enter();return}
      msg('נשלח מייל אימות אל <b>'+esc(email)+'</b>.<br>יש ללחוץ על הקישור שבמייל, ואז לחזור לכאן וללחוץ «כניסה».<br>אחרי האימות המנהל צריך לאשר את החשבון.','ok')};
    db.auth.onAuthStateChange((_e,session)=>{if(session)setTimeout(enter,0)});
    await enter();
  })();
  </script>
</body>
</html>
