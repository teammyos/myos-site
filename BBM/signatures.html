<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17344d">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>מעקב חתימות · BBM</title>
<link rel="stylesheet" href="css/app.css?v=20261123f">
</head>
<body>
<div class="band">
  <div class="band-in">
    <div><h1>מעקב חתימות</h1><p class="sub" id="count" aria-live="polite">טופסי 4 · תשריטי בית משותף · רישום הפקעות · תצ"רים</p></div>
    <div class="actions">
      <button id="exportBtn" type="button" class="on-dark">ייצוא לאקסל</button>
      <button class="btn gold" id="newBtn" type="button" hidden>+ רשומה חדשה</button>
    </div>
  </div>
</div>
<main class="under-band">
  <form class="card search" id="filters" autocomplete="off">
    <input class="big" name="q" type="search" placeholder="חיפוש לפי כתובת, גוש/חלקה, מספר בקשה, תכנית, מהות או הערה…" aria-label="חיפוש">
    <div class="chips-row">
      <div class="chips" id="kindChips" role="group" aria-label="סוג הדוח"></div>
      <div class="sig-filters">
        <label class="group-by" id="yearWrap"><span id="yearLabel">שנה</span> <select name="year" id="yearSel"><option value="">הכול</option></select></label>
        <label class="group-by" id="f2Wrap"><span id="f2Label"></span> <select name="f2" id="f2Sel"><option value="">הכול</option></select></label>
        <label class="group-by chk" id="unsignedWrap"><input type="checkbox" name="unsigned" value="1"> לא נחתם</label>
      </div>
    </div>
    <input type="hidden" name="kind" value="form4">
  </form>

  <section class="card" id="editCard" hidden>
    <h2 id="editTitle">רשומה חדשה</h2>
    <form id="editForm" class="sig-form" autocomplete="off">
      <div id="editFields" class="sig-fields"></div>
      <div class="full sig-actions">
        <button class="primary" type="submit">שמירה</button>
        <button type="button" id="cancelEdit">ביטול</button>
        <button type="button" class="link danger" id="deleteBtn" hidden>מחיקת הרשומה</button>
        <span class="hint" id="editMeta"></span>
      </div>
    </form>
  </section>

  <div class="card" id="importCard" hidden>
    <h2>ייבוא ראשוני מהאקסל</h2>
    <p class="hint" id="importHint"></p>
    <p><input type="file" id="importFile" accept=".json,application/json"> <span id="importMsg" role="status"></span></p>
  </div>

  <div id="results"><p class="hint">טוען…</p></div>
</main>
<script src="js/config.js?v=20261123f"></script>
<script src="js/vendor/supabase.umd.js?v=20261123f"></script>
<script src="js/lookups.js?v=20261123f"></script>
<script src="js/demo-data.js?v=20261123f"></script>
<script src="js/data.js?v=20261123f"></script>
<script src="js/ui.js?v=20261123f"></script>
<script>
(async function () {
  const { ui, data } = BBM, esc = ui.esc;
  if (!(await ui.start({ base: '', active: 'signatures' }))) return;
  const sb = data.supabase, live = data.mode === 'live';
  const canEdit = ui.canEdit(), isAdmin = BBM.me && BBM.me.role === 'admin';
  const form = document.getElementById('filters'), results = document.getElementById('results');
  let all = [], shown = [];

  // ---------- הגדרת ארבעת הדוחות ----------
  // שדה: k = שם; x:true = נשמר ב-extra; type: text | date (עמודת תאריך) | dateish (תאריך או טקסט כמו V) | bool | area
  const ISO = /^\d{4}-\d\d-\d\d$/;
  const has = v => v != null && String(v).trim() !== '' && !/^\?+$/.test(String(v).trim()) && String(v).trim() !== 'לא נחתם';
  const KDEF = {
    form4: { label: 'טופסי 4', one: 'טופס 4', yearLabel: 'שנה', f2: { label: 'שטח ציבורי', get: r => r.public_area_status },
      fields: [{ k: 'sign_date', t: 'תאריך', type: 'date', req: true }, { k: 'gush', t: 'גוש', num: true }, { k: 'helka', t: 'חלקה', num: true },
        { k: 'address', t: 'כתובת', wide: true, req: true }, { k: 'request_number', t: "מס' בקשה", num: true }, { k: 'essence', t: 'מהות', wide: true, list: true },
        { k: 'signed', t: 'נחתם', type: 'bool' }, { k: 'public_area_status', t: 'שטח ציבורי', list: true, ph: 'נמסר / לא קיים / לא נדרש' }, { k: 'notes', t: 'הערות', type: 'area' }] },
    condo_plan: { label: 'תשריטי בית משותף', one: 'תשריט בית משותף', yearLabel: 'שנה',
      fields: [{ k: 'sign_date', t: 'תאריך', type: 'date', req: true }, { k: 'gush', t: 'גוש', num: true }, { k: 'helka', t: 'חלקה', num: true },
        { k: 'address', t: 'כתובת', wide: true, req: true }, { k: 'signed', t: 'נחתם', type: 'bool' }, { k: 'essence', t: 'מהות התשריט', wide: true, list: true }, { k: 'notes', t: 'הערות', type: 'area' }] },
    expropriation: { label: 'רישום הפקעות', one: 'רישום הפקעה', yearLabel: 'שנת משלוח 5 ו-7', mainDate: 'sent57',
      stage: r => { const x = r.extra || {}; return has(x.yp19) || has(x.ypdate19) ? 'פורסם לפי 19' : has(x.sent19) ? 'נשלח לפי 19' : has(x.yp57) || has(x.ypdate57) ? 'פורסם לפי 5 ו-7' : has(x.sent57) ? 'נשלח לפי 5 ו-7' : has(x.committee) ? 'אושר בוועדה' : 'טרם התחיל'; },
      stages: ['טרם התחיל', 'אושר בוועדה', 'נשלח לפי 5 ו-7', 'פורסם לפי 5 ו-7', 'נשלח לפי 19', 'פורסם לפי 19'],
      fields: [{ k: 'gush', t: 'גוש', num: true, req: true }, { k: 'helka', t: 'חלקה', num: true, req: true }, { k: 'part', x: true, t: 'ח"ח / בשלמות', list: true },
        { k: 'designation', x: true, t: 'ייעוד', list: true }, { k: 'plan', x: true, t: 'תב"ע', list: true }, { k: 'committee', x: true, t: 'אושר ע"י הוועדה', type: 'dateish' },
        { k: 'sent57', x: true, t: 'נשלח לפי 5 ו-7', type: 'dateish' }, { k: 'ref57', x: true, t: 'אסמכתא (5 ו-7)', num: true }, { k: 'file57', x: true, t: "מס' תיק במ. המשפטים (5 ו-7)", num: true },
        { k: 'yp57', x: true, t: 'פורסם בי"פ (5 ו-7)', num: true }, { k: 'ypdate57', x: true, t: 'תאריך פרסום (5 ו-7)', type: 'dateish' },
        { k: 'sent19', x: true, t: 'נשלח לפי 19', type: 'dateish' }, { k: 'ref19', x: true, t: 'אסמכתא (19)', num: true }, { k: 'file19', x: true, t: "מס' תיק במ. המשפטים (19)", num: true },
        { k: 'yp19', x: true, t: 'פורסם בי"פ (19)', num: true }, { k: 'ypdate19', x: true, t: 'תאריך פרסום (19)', type: 'dateish' }, { k: 'notes', t: 'הערות', type: 'area' }] },
    tatzar: { label: 'תצ"רים', one: 'תצ"ר', yearLabel: 'שנת הגשה', mainDate: 'submitted',
      stage: r => { const x = r.extra || {}; return has(x.chairman) ? 'נחתם ע"י היו"ר' : has(x.committee) ? 'אושר בוועדה' : has(x.sent_eyal) ? 'נשלח לאייל' : has(x.submitted) ? 'הוגש' : 'טרם הוגש'; },
      stages: ['טרם הוגש', 'הוגש', 'נשלח לאייל', 'אושר בוועדה', 'נחתם ע"י היו"ר'],
      fields: [{ k: 'tatzar_no', x: true, t: "מס' תצ\"ר", num: true, req: true }, { k: 'plan', x: true, t: 'התכנית שאליה מתייחס התצ"ר', list: true }, { k: 'based_on', x: true, t: 'מבוסס על תצ"ר כשר לרישום' },
        { k: 'gush', t: 'גוש', num: true }, { k: 'helka', t: 'חלקה' }, { k: 'address', t: 'כתובת', wide: true },
        { k: 'submitted', x: true, t: 'תאריך הגשת התצ"ר', type: 'dateish' }, { k: 'sent_eyal', x: true, t: 'נשלח לאייל', type: 'dateish' },
        { k: 'committee', x: true, t: 'תאריך אישור הוועדה', type: 'dateish' }, { k: 'chairman', x: true, t: 'תאריך חתימת היו"ר', type: 'dateish' },
        { k: 'essence', t: 'מהות התצ"ר', wide: true, list: true }, { k: 'new_parcels', x: true, t: 'מספרי החלקות החדשים', wide: true },
        { k: 'contact', x: true, t: 'איש קשר', list: true }, { k: 'phone', x: true, t: 'טלפון', num: true }, { k: 'notes', t: 'הערות', type: 'area' }] },
  };
  const KINDS = Object.keys(KDEF);
  const val = (r, f) => f.x ? (r.extra || {})[f.k] : r[f.k];
  const fmtD = d => d ? new Date(d).toLocaleDateString('he-IL') : '';
  const showVal = (r, f) => { const v = val(r, f); if (v == null || v === '') return '';
    if (f.type === 'date' || (f.type === 'dateish' && ISO.test(v))) return fmtD(v);
    if (f.type === 'bool') return v ? 'כן' : 'לא'; return String(v); };

  // נכסים לפי גוש/חלקה – כדי לקשר רשומה לנכסים שבאותה חלקה
  const byParcel = new Map();
  data.listAssets().forEach(a => (a.parcels || []).forEach(p => {
    const k = `${p.gush}/${p.helka}`; if (!byParcel.has(k)) byParcel.set(k, []); byParcel.get(k).push(a);
  }));
  const assetsOf = r => (r.gush && r.helka && /^\d+$/.test(r.helka)) ? (byParcel.get(`${r.gush}/${r.helka}`) || []) : [];

  async function load() {
    if (!live) { all = []; return; }
    const rows = []; const page = 1000;
    for (let from = 0; ; from += page) {
      const { data: d, error } = await sb.from('signatures').select('*').order('created_at').order('id').range(from, from + page - 1);
      if (error) { results.innerHTML = `<div class="card error">לא ניתן לטעון את הנתונים: ${esc(error.message)}</div>`; throw error; }
      rows.push(...d); if (d.length < page) break;
    }
    all = rows; sortAll();
  }
  // מיון: לפי התאריך הראשי מהחדש לישן; רשומות בלי תאריך – בסוף, לפי גוש וחלקה
  const sortAll = () => all.sort((x, y) => (y.sign_date || '').localeCompare(x.sign_date || '') || (x.gush || '').localeCompare(y.gush || '') || (+x.helka || 0) - (+y.helka || 0));

  const norm = s => (s || '').toString().toLowerCase().replace(/["'״׳]/g, '');
  const columns = k => {
    const def = KDEF[k];
    return [
      ...def.fields.map(f => ({ title: f.t, value: r => showVal(r, f), cls: f.num || f.type === 'date' || f.type === 'dateish' ? 'num' : '',
        html: f.type === 'bool' ? (r => val(r, f) ? '<span class="pill ok">נחתם</span>' : '<span class="pill warn">לא נחתם</span>')
          : f.type === 'area' ? (r => val(r, f) ? `<span class="sig-note">${esc(val(r, f))}</span>` : '') : null })),
      ...(def.stage ? [{ title: 'שלב', value: r => def.stage(r), html: r => `<span class="pill ${def.stage(r) === def.stages[def.stages.length - 1] ? 'ok' : 'info'}">${esc(def.stage(r))}</span>` }] : []),
      { title: 'נכסים בחלקה', value: r => assetsOf(r).map(a => a.asset_number).join(', '),
        html: r => assetsOf(r).map(a => `<a href="assets/asset.html?id=${encodeURIComponent(a.id)}" title="${esc(a.title)}">${esc(a.asset_number)}</a>`).join(' ') },
      { title: 'נרשם על ידי', value: r => r.import_source_row ? 'יובא מהאקסל' : r.created_by_name },
    ];
  };

  function render() {
    const f = Object.fromEntries(new FormData(form));
    const kind = KDEF[f.kind] ? f.kind : 'form4', def = KDEF[kind];
    document.getElementById('kindChips').innerHTML = KINDS.map(k =>
      `<button type="button" class="chip" data-kind="${k}" aria-pressed="${k === kind}">${KDEF[k].label} <span class="n">${all.filter(r => r.kind === k).length}</span></button>`).join('');
    const ofKind = all.filter(r => r.kind === kind);
    // סינון לפי שנה (של התאריך הראשי בדוח)
    document.getElementById('yearLabel').textContent = def.yearLabel;
    const years = [...new Set(ofKind.map(r => (r.sign_date || '').slice(0, 4)).filter(Boolean))].sort().reverse();
    const ySel = document.getElementById('yearSel'), cur = ySel.value;
    ySel.innerHTML = '<option value="">הכול</option>' + years.map(y => `<option${y === cur ? ' selected' : ''}>${y}</option>`).join('');
    // סינון שני: "שטח ציבורי" בטופסי 4, "שלב" בהפקעות ובתצ"רים
    const f2 = def.stage ? { label: 'שלב', get: def.stage, order: def.stages } : def.f2;
    const f2Wrap = document.getElementById('f2Wrap'), f2Sel = document.getElementById('f2Sel'), f2cur = f2Sel.value;
    f2Wrap.hidden = !f2;
    if (f2) {
      document.getElementById('f2Label').textContent = f2.label;
      const present = new Map(); ofKind.forEach(r => { const v = f2.get(r); if (v) present.set(v, (present.get(v) || 0) + 1); });
      const opts = (f2.order || [...present.keys()].sort()).filter(v => present.has(v));
      f2Sel.innerHTML = '<option value="">הכול</option>' + opts.map(v => `<option value="${esc(v)}"${v === f2cur ? ' selected' : ''}>${esc(v)} (${present.get(v)})</option>`).join('');
    }
    const hasBool = def.fields.some(x => x.type === 'bool');
    document.getElementById('unsignedWrap').hidden = !hasBool;

    const q = norm(f.q).trim();
    shown = ofKind.filter(r => {
      if (ySel.value && (r.sign_date || '').slice(0, 4) !== ySel.value) return false;
      if (f2 && f2Sel.value && f2.get(r) !== f2Sel.value) return false;
      if (hasBool && f.unsigned && r.signed) return false;
      if (!q) return true;
      const hay = norm([`${r.gush}/${r.helka}`, ...def.fields.map(x => showVal(r, x)), ...def.fields.map(x => val(r, x))].join(' '));
      return q.split(/\s+/).every(w => hay.includes(w));
    });
    document.getElementById('count').textContent = `${def.label}: ${shown.length === ofKind.length ? ofKind.length : shown.length + ' מתוך ' + ofKind.length} רשומות`;
    const nb = document.getElementById('newBtn'); nb.textContent = `+ ${def.one}`;
    const cols = columns(kind);
    if (!live) { results.innerHTML = '<div class="card">במצב הדגמה אין נתוני מעקב.</div>'; return; }
    if (!shown.length) { results.innerHTML = `<div class="card empty">${ofKind.length ? 'לא נמצאו רשומות לפי החיפוש והסינון' : 'עוד אין רשומות בדוח הזה'}</div>`; return; }
    results.innerHTML = `<div class="table-wrap"><table class="data sig-table clickable"><thead><tr>${cols.map(c => `<th scope="col">${c.title}</th>`).join('')}</tr></thead>
      <tbody>${shown.map(r => `<tr data-id="${esc(r.id)}">${cols.map(c => `<td class="${c.cls || ''}">${c.html ? c.html(r) : esc(c.value(r) ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  document.getElementById('kindChips').addEventListener('click', e => {
    const b = e.target.closest('[data-kind]'); if (!b) return;
    form.elements.kind.value = b.dataset.kind; document.getElementById('yearSel').value = ''; document.getElementById('f2Sel').value = '';
    document.getElementById('editCard').hidden = true; render();
  });
  form.addEventListener('input', render);
  form.addEventListener('submit', e => e.preventDefault());
  document.getElementById('exportBtn').onclick = () => {
    const kind = form.elements.kind.value, stamp = new Date().toISOString().slice(0, 10);
    ui.download(`${KDEF[kind].label.replace(/["\s]+/g, '-')}-${stamp}.csv`, data.toCsv(shown, columns(kind).map(c => ({ title: c.title, value: c.value }))));
  };

  // ---------- הוספה ועריכה (הטופס נבנה לפי סוג הדוח) ----------
  const editCard = document.getElementById('editCard'), ef = document.getElementById('editForm'), fieldsBox = document.getElementById('editFields');
  let editing = null, editKind = 'form4';
  const toInput = (v, f) => v == null ? '' : (f.type === 'dateish' && ISO.test(v)) ? v.split('-').reverse().join('.') : String(v);
  // "תאריך או טקסט": 1.2.2026 או 01/02/2026 נשמר כתאריך; כל דבר אחר (למשל V) נשמר כמו שהוא
  const fromDateish = s => { const m = /^(\d{1,2})[./](\d{1,2})[./](\d{4})$/.exec(s); if (!m) return s;
    const iso = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; return isNaN(new Date(iso)) ? s : iso; };
  function openEdit(r) {
    editing = r || null; editKind = r ? r.kind : form.elements.kind.value;
    const def = KDEF[editKind], v = r || { sign_date: new Date().toISOString().slice(0, 10), signed: true, extra: {} };
    document.getElementById('editTitle').textContent = (r ? 'עריכה: ' : 'חדש: ') + def.one;
    const lists = k => [...new Set(all.filter(x => x.kind === editKind).map(x => val(x, k)).filter(Boolean))].slice(0, 80);
    fieldsBox.innerHTML = def.fields.map(f => {
      const cur = val(v, f), name = `f_${f.k}`;
      const cls = `f${f.wide ? ' grow' : ''}${f.type === 'area' ? ' full' : ''}`;
      if (f.type === 'bool') return `<label class="${cls}">${f.t}<select name="${name}"><option value="true"${cur ? ' selected' : ''}>כן</option><option value=""${cur ? '' : ' selected'}>לא / בבדיקה</option></select></label>`;
      if (f.type === 'area') return `<label class="${cls}">${f.t}<textarea name="${name}" rows="2">${esc(cur || '')}</textarea></label>`;
      if (f.type === 'date') return `<label class="${cls}">${f.t}<input type="date" name="${name}" value="${esc(cur || '')}"${f.req ? ' required' : ''}></label>`;
      return `<label class="${cls}">${f.t}<input name="${name}" value="${esc(toInput(cur, f))}"${f.req ? ' required' : ''}${f.num ? ' inputmode="numeric" dir="ltr"' : ''}
        ${f.type === 'dateish' ? 'placeholder="למשל 24.11.2026, או V" dir="ltr"' : f.ph ? `placeholder="${esc(f.ph)}"` : ''}${f.list ? ` list="l_${f.k}"` : ''}>
        ${f.list ? `<datalist id="l_${f.k}">${lists(f).map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}</label>`;
    }).join('');
    document.getElementById('deleteBtn').hidden = !(r && isAdmin);
    document.getElementById('editMeta').textContent = r ? `${r.import_source_row ? 'יובא מהאקסל' : 'נרשם על ידי ' + (r.created_by_name || 'לא ידוע')} · ${new Date(r.created_at).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}` : 'השם שלך והתאריך נרשמים אוטומטית.';
    editCard.hidden = false; editCard.scrollIntoView({ block: 'start' });
    const first = fieldsBox.querySelector('input,select,textarea'); if (first) first.focus();
  }
  if (canEdit && live) { const nb = document.getElementById('newBtn'); nb.hidden = false; nb.onclick = () => openEdit(null); }
  document.getElementById('cancelEdit').onclick = () => { editCard.hidden = true; };
  // לחיצה על שורה פותחת מתחתיה כרטיסייה לקריאה בלבד; עריכה רק בכפתור "עריכה" שבתוכה
  function closeDetail() {
    results.querySelectorAll('tr.sig-detail').forEach(x => x.remove());
    results.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
  }
  function openDetail(tr) {
    const r = all.find(x => x.id === tr.dataset.id); if (!r) return;
    const def = KDEF[r.kind], links = assetsOf(r);
    const items = def.fields.filter(f => f.type !== 'area').map(f => [f.t, f.type === 'bool' ? (val(r, f) ? 'כן' : 'לא') : showVal(r, f)]);
    if (def.stage) items.push(['שלב', def.stage(r)]);
    const note = def.fields.filter(f => f.type === 'area').map(f => val(r, f)).filter(Boolean).join('\n');
    const meta = `${r.import_source_row ? 'יובא מהאקסל' : 'נרשם על ידי ' + (r.created_by_name || 'לא ידוע')} · ${new Date(r.created_at).toLocaleDateString('he-IL')}`;
    const row = document.createElement('tr'); row.className = 'sig-detail';
    row.innerHTML = `<td colspan="${tr.children.length}"><div class="sig-card">
      <div class="sig-card-head"><strong>${esc(def.one)}${r.gush ? ` · גוש ${esc(r.gush)}${r.helka ? ' חלקה ' + esc(r.helka) : ''}` : ''}${r.address ? ' · ' + esc(r.address) : ''}</strong>
        <span class="sig-card-actions">${canEdit ? '<button type="button" class="primary" data-act="edit">✎ עריכה</button>' : ''}<button type="button" data-act="close">סגירה</button></span></div>
      <dl class="sig-kv">${items.map(([t, v]) => `<div><dt>${esc(t)}</dt><dd>${v ? esc(v) : '<span class="muted">—</span>'}</dd></div>`).join('')}</dl>
      ${note ? `<p class="sig-card-note"><span class="muted">הערות:</span> ${esc(note)}</p>` : ''}
      ${links.length ? `<p class="sig-card-note"><span class="muted">נכסים בחלקה:</span> ${links.map(a => `<a href="assets/asset.html?id=${encodeURIComponent(a.id)}">${esc(a.asset_number)} – ${esc(a.title)}</a>`).join(' · ')}</p>` : ''}
      <p class="hint">${esc(meta)}</p></div></td>`;
    // הטבלה רחבה מהמסך – הכרטיסייה נשארת ברוחב החלון הנראה
    const wrap = results.querySelector('.table-wrap'); if (wrap) row.querySelector('.sig-card').style.width = (wrap.clientWidth - 22) + 'px';
    tr.classList.add('sel'); tr.after(row);
  }
  results.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const act = e.target.closest('[data-act]');
    if (act) {
      const id = act.closest('tr.sig-detail').previousElementSibling.dataset.id;
      if (act.dataset.act === 'edit' && canEdit) openEdit(all.find(r => r.id === id)); else closeDetail();
      return;
    }
    if (e.target.closest('tr.sig-detail')) return;
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const wasOpen = tr.classList.contains('sel'); closeDetail(); if (!wasOpen) openDetail(tr);
  });
  ef.addEventListener('submit', async e => {
    e.preventDefault();
    const def = KDEF[editKind];
    const row = { kind: editKind, extra: { ...((editing && editing.extra) || {}) } };
    for (const f of def.fields) {
      const raw = ef.elements[`f_${f.k}`].value.trim();
      let v = f.type === 'bool' ? raw === 'true' : raw === '' ? null : f.type === 'dateish' ? fromDateish(raw) : raw;
      if (f.x) { if (v == null) delete row.extra[f.k]; else row.extra[f.k] = v; } else row[f.k] = v;
    }
    // התאריך הראשי של הדוח (למיון ולסינון לפי שנה)
    if (def.mainDate) { const m = row.extra[def.mainDate]; row.sign_date = m && ISO.test(m) ? m : null; }
    const btn = ef.querySelector('button[type=submit]'); btn.disabled = true;
    const q = editing ? sb.from('signatures').update(row).eq('id', editing.id) : sb.from('signatures').insert(row);
    const { data: saved, error } = await q.select().single();
    btn.disabled = false;
    if (error) { ui.toast('השמירה נכשלה: ' + error.message, 'err'); return; }
    if (editing) all[all.findIndex(r => r.id === editing.id)] = saved; else all.push(saved);
    sortAll(); form.elements.kind.value = saved.kind; editCard.hidden = true; ui.toast('נשמר'); render();
  });
  const del = document.getElementById('deleteBtn');
  del.onclick = async () => {
    if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'ללחוץ שוב לאישור המחיקה'; return; }
    const { error } = await sb.from('signatures').delete().eq('id', editing.id);
    delete del.dataset.sure; del.textContent = 'מחיקת הרשומה';
    if (error) { ui.toast('המחיקה נכשלה: ' + error.message, 'err'); return; }
    all = all.filter(r => r.id !== editing.id); editCard.hidden = true; ui.toast('נמחק'); render();
  };

  // ---------- ייבוא ראשוני (מנהל): רק לדוחות שעדיין ריקים ----------
  function setupImport() {
    const empty = KINDS.filter(k => !all.some(r => r.kind === k));
    const card = document.getElementById('importCard');
    card.hidden = !(live && isAdmin && empty.length);
    document.getElementById('importHint').innerHTML = `הדוחות האלה עדיין ריקים: <strong>${empty.map(k => KDEF[k].label).join(', ')}</strong>. בוחרים את הקובץ <strong>ייבוא-מעקבים.json</strong> מתיקיית "ייבוא". ייכנסו רק הדוחות הריקים; דוח שכבר יש בו רשומות לא ישתנה.`;
    document.getElementById('importFile').onchange = async e => {
      const msg = document.getElementById('importMsg'), f = e.target.files[0]; if (!f) return;
      let p; try { p = JSON.parse(await f.text()); } catch (err) { p = null; }
      if (!p || p.kind !== 'signatures' || !Array.isArray(p.rows)) { msg.innerHTML = '<span class="error">זה לא קובץ ייבוא של מעקבים.</span>'; return; }
      await load();   // בדיקה עדכנית מול המסד
      const stillEmpty = KINDS.filter(k => !all.some(r => r.kind === k));
      const rows = p.rows.filter(r => stillEmpty.includes(r.kind)).map(r => ({ ...r, extra: r.extra || {} }));
      if (!rows.length) { msg.innerHTML = '<span class="error">אין בקובץ רשומות לדוחות הריקים.</span>'; return; }
      msg.textContent = `מייבא ${rows.length} רשומות…`;
      for (let i = 0; i < rows.length; i += 200) {
        const { error } = await sb.from('signatures').insert(rows.slice(i, i + 200));
        if (error) { msg.innerHTML = `<span class="error">הייבוא נעצר אחרי ${i} רשומות: ${esc(error.message)}</span>`; return; }
      }
      msg.textContent = ''; ui.toast(`יובאו ${rows.length} רשומות`); await load(); setupImport(); render();
    };
  }

  await load(); setupImport(); render();
})();
</script>
</body>
</html>
