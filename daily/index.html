<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyOS Daily — לימוד יומי</title>
<meta name="description" content="MyOS Daily — הלימוד היומי שלך: דף יומי וכל המחזורים, לוח שנה עברי, ולוח לימוד אישי בקצב שלך. שירות חינם מבית MyOS.">
<meta name="theme-color" content="#0E1A33">
<meta property="og:title" content="MyOS Daily — לימוד יומי">
<meta property="og:description" content="דף יומי וכל המחזורים, לוח עברי ולוח לימוד אישי בקצב שלך.">
<meta property="og:url" content="https://myos.co.il/daily/">
<link rel="icon" href="app/favicon.ico">
<style>
  :root{
    --bg:#0E1A33; --bg2:#0b1428; --line:#26375c; --text:#ffffff; --muted:#a9b6cf;
    --accent:#2ff0e6; --accent-ink:#04121a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 600px at 50% -10%, #16264a 0%, var(--bg) 55%, var(--bg2) 100%);
    color:var(--text); font-family:'Heebo',system-ui,'Segoe UI',Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100dvh;
  }
  a{color:var(--accent)}
  header{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:14px clamp(16px,4vw,32px);
  }
  .brand{display:flex; align-items:baseline; gap:0; direction:ltr; font-weight:700; font-size:1.25rem; letter-spacing:-.01em}
  .brand .my{color:#13a8bd}
  .brand .s{color:#5ff5ec}
  .brand .daily{color:#fff; font-size:.85em; margin-inline-start:.25rem}
  .tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .chip{
    background:transparent; color:var(--text); border:1px solid var(--line);
    border-radius:999px; padding:7px 14px; font:inherit; font-size:.85rem; cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
  .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 16px 8px}
  .note{color:var(--muted); font-size:.85rem; text-align:center; padding:10px 16px 18px; max-width:46rem; margin:0 auto}

  /* ---- מסגרת הטלפון (תצוגת בדיקה; תוסר כשנסיים) ---- */
  .phone{
    position:relative; width:var(--w,390px); height:var(--h,844px); max-height:calc(100dvh - 150px);
    background:#05070d; border-radius:44px; padding:34px 12px 14px;
    box-shadow:0 0 0 2px #2b3b5e, 0 30px 70px rgba(0,0,0,.55), inset 0 0 0 1px #0b1220;
  }
  .phone::after{ /* חריץ המצלמה */
    content:""; position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:110px; height:18px; background:#05070d; border-radius:16px; z-index:2; pointer-events:none;
  }
  .phone iframe{width:100%; height:100%; border:0; border-radius:34px; background:#0E1A33; display:block}
  .full .phone{width:min(100%,1100px); height:calc(100dvh - 120px); max-height:none; border-radius:16px; padding:0; box-shadow:none}
  .full .phone::after{display:none}
  .full .phone iframe{border-radius:12px}

  /* בטלפון אמיתי אין מסגרת — האפליקציה תופסת את כל המסך */
  @media (max-width:820px){
    header{padding:8px 12px}
    .tools .sizes{display:none}
    main{padding:0}
    .phone{width:100%; height:calc(100dvh - 58px); max-height:none; border-radius:0; padding:0; box-shadow:none}
    .phone::after{display:none}
    .phone iframe{border-radius:0}
    .note{display:none}
  }
</style>
</head>
<body>
  <header>
    <span class="brand" aria-label="MyOS Daily"><span class="my">My</span><span class="s">OS</span><span class="daily">Daily</span></span>
    <div class="tools">
      <span class="sizes" style="display:inline-flex; gap:8px">
        <button class="chip" data-w="390" data-h="844" aria-pressed="true">אייפון <span dir="ltr">390×844</span></button>
        <button class="chip" data-w="412" data-h="915" aria-pressed="false">אנדרואיד <span dir="ltr">412×915</span></button>
      </span>
      <button class="chip" id="fullBtn" aria-pressed="false">מסך מלא</button>
      <a class="chip" href="app/" target="_blank" rel="noopener">פתיחה בלשונית</a>
    </div>
  </header>

  <main id="stage">
    <div class="phone" id="phone">
      <iframe id="app" src="app/" title="MyOS Daily" allow="clipboard-write"></iframe>
    </div>
  </main>

  <p class="note">תצוגת בדיקה: האפליקציה רצה כאן בתוך מסגרת טלפון. בטלפון עצמו היא נפתחת במסך מלא.
    אפשר להוסיף אותה למסך הבית: בכרום — תפריט ⋮ ← «הוספה למסך הבית».</p>

<script>
  const phone = document.getElementById('phone');
  const stage = document.getElementById('stage');
  const sizes = document.querySelectorAll('.chip[data-w]');
  const fullBtn = document.getElementById('fullBtn');

  function setSize(btn) {
    sizes.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    phone.style.setProperty('--w', btn.dataset.w + 'px');
    phone.style.setProperty('--h', btn.dataset.h + 'px');
    try { localStorage.setItem('myos-daily-frame-size', btn.dataset.w); } catch (e) {}
  }
  sizes.forEach((b) => b.addEventListener('click', () => setSize(b)));
  try {
    const saved = localStorage.getItem('myos-daily-frame-size');
    const match = [...sizes].find((b) => b.dataset.w === saved);
    if (match) setSize(match);
  } catch (e) {}

  fullBtn.addEventListener('click', () => {
    const on = document.body.classList.toggle('full');
    fullBtn.setAttribute('aria-pressed', String(on));
    fullBtn.textContent = on ? 'תצוגת טלפון' : 'מסך מלא';
  });
</script>
</body>
</html>
